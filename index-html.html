<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Briefing Room — Corporate Law Firm Simulator</title>
<meta name="theme-color" content="#101a2e">
<meta name="application-name" content="Briefing Rooms">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Briefing Rooms">
<link rel="apple-touch-icon" sizes="180x180" href="br-icon-180.png">
<link rel="apple-touch-icon-precomposed" sizes="180x180" href="br-icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="br-icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="br-icon-512.png">
<link rel="shortcut icon" type="image/png" href="br-icon-192.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --black:#07080c;
  --ink:#0b0e16;
  --navy:#101a2e;
  --navy2:#16233f;
  --navy3:#1d2f55;
  --blue:#2b4c8c;
  --blue2:#3a63b8;
  --gold:#c8a45c;
  --white:#ffffff;
  --paper:#f5f6f9;
  --mist:#aab4c8;
  --mist2:#6b7890;
  --line:rgba(255,255,255,.09);
  --line2:rgba(255,255,255,.16);
  --green:#3fae7a;
  --red:#d05252;
  --amber:#d9a441;
  --shadow:0 18px 50px rgba(0,0,0,.45);
  --r:14px;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  background:var(--black);
  color:var(--white);
  font-family:'Inter',system-ui,sans-serif;
  font-size:15px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
.serif{font-family:'Libre Caslon Text',Georgia,serif}
.mono{font-family:'IBM Plex Mono',monospace}
a{color:inherit}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--navy3);border-radius:6px}
::-webkit-scrollbar-track{background:transparent}

/* ---------- generic ---------- */
.btn{
  display:inline-flex;align-items:center;gap:8px;
  background:var(--blue);color:#fff;border:1px solid transparent;
  padding:10px 18px;border-radius:10px;font-weight:600;font-size:14px;
  transition:.18s;
}
.btn:hover{background:var(--blue2);transform:translateY(-1px)}
.btn.ghost{background:transparent;border:1px solid var(--line2);color:var(--white)}
.btn.ghost:hover{border-color:var(--blue2);background:rgba(58,99,184,.12)}
.btn.gold{background:transparent;border:1px solid var(--gold);color:var(--gold)}
.btn.gold:hover{background:rgba(200,164,92,.12)}
.btn.danger{background:transparent;border:1px solid var(--red);color:var(--red)}
.btn.danger:hover{background:rgba(208,82,82,.12)}
.btn.sm{padding:6px 12px;font-size:12.5px;border-radius:8px}
.btn.xs{padding:4px 10px;font-size:11.5px;border-radius:7px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.field{margin-bottom:14px}
.field label{display:block;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--mist);margin-bottom:6px}
.field input,.field select,.field textarea{
  width:100%;background:var(--ink);border:1px solid var(--line2);
  color:var(--white);padding:10px 12px;border-radius:9px;outline:none;transition:.15s;
}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--blue2);box-shadow:0 0 0 3px rgba(58,99,184,.18)}
.field textarea{resize:vertical;min-height:80px}
.field .hint{font-size:11.5px;color:var(--mist);margin-top:4px}
.card{background:var(--navy);border:1px solid var(--line);border-radius:var(--r);padding:22px}
.card.pad-lg{padding:28px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--line2);color:var(--mist)}
.chip.blue{color:#9db8ea;border-color:rgba(58,99,184,.55);background:rgba(43,76,140,.18)}
.chip.gold{color:var(--gold);border-color:rgba(200,164,92,.5);background:rgba(200,164,92,.1)}
.chip.green{color:#7dd6ac;border-color:rgba(63,174,122,.5);background:rgba(63,174,122,.12)}
.chip.red{color:#eb9a9a;border-color:rgba(208,82,82,.5);background:rgba(208,82,82,.12)}
.chip.amber{color:#eec581;border-color:rgba(217,164,65,.5);background:rgba(217,164,65,.12)}
.muted{color:var(--mist)}
.small{font-size:12.5px}
.tiny{font-size:11px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.row{display:flex;align-items:center;gap:10px}
.spread{display:flex;align-items:center;justify-content:space-between;gap:12px}
.avatar{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:#fff;flex:none}
.avatar.lg{width:52px;height:52px;font-size:17px}
.divider{height:1px;background:var(--line);margin:18px 0}
.empty{border:1px dashed var(--line2);border-radius:var(--r);padding:34px;text-align:center;color:var(--mist);font-size:13.5px}
.tag-side{font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:2px 8px;border-radius:5px}
.tag-side.client{background:rgba(58,99,184,.25);color:#a9c2f2}
.tag-side.counter{background:rgba(200,164,92,.2);color:var(--gold)}

/* ---------- modal ---------- */
.modal-wrap{position:fixed;inset:0;background:rgba(4,5,9,.72);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;z-index:200;padding:20px}
.modal{background:var(--navy);border:1px solid var(--line2);border-radius:18px;width:100%;max-width:640px;max-height:88vh;overflow:auto;padding:28px;box-shadow:var(--shadow)}
.modal h3{font-size:20px;margin-bottom:4px}
.modal .sub{color:var(--mist);font-size:13px;margin-bottom:18px}
.modal.wide{max-width:860px}

/* ---------- toast ---------- */
#toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--navy2);border:1px solid var(--blue2);color:#fff;padding:12px 22px;border-radius:12px;font-size:13.5px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:400;box-shadow:var(--shadow)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ---------- landing ---------- */
.landing{min-height:100vh;display:flex;flex-direction:column}
.land-nav{display:flex;align-items:center;justify-content:space-between;padding:22px 6vw;border-bottom:1px solid var(--line)}
.land-logo{display:flex;align-items:center;gap:14px}
.land-logo .mark{width:42px;height:42px;border:1.5px solid var(--gold);display:flex;align-items:center;justify-content:center;font-family:'Libre Caslon Text',serif;font-size:18px;color:var(--gold)}
.land-logo .nm{font-family:'Libre Caslon Text',serif;font-size:19px;letter-spacing:.02em}
.land-logo .sb{font-size:10px;letter-spacing:.28em;text-transform:uppercase;color:var(--mist)}
.hero{padding:9vh 6vw 7vh;max-width:1200px}
.hero .kicker{font-size:11px;letter-spacing:.34em;text-transform:uppercase;color:var(--gold);margin-bottom:22px}
.hero h1{font-family:'Libre Caslon Text',serif;font-size:clamp(38px,5.4vw,66px);line-height:1.12;font-weight:400;margin-bottom:24px}
.hero h1 em{font-style:italic;color:#9db8ea}
.hero p{max-width:620px;color:var(--mist);font-size:16.5px;margin-bottom:34px}
.land-stats{display:flex;gap:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:0 6vw}
.land-stats>div{flex:1;padding:26px 28px;border-right:1px solid var(--line)}
.land-stats>div:last-child{border-right:none}
.land-stats .n{font-family:'Libre Caslon Text',serif;font-size:30px;color:#fff}
.land-stats .l{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--mist);margin-top:4px}
.land-sec{padding:60px 6vw;max-width:1300px}
.land-sec h2{font-family:'Libre Caslon Text',serif;font-size:30px;font-weight:400;margin-bottom:8px}
.land-sec .lead{color:var(--mist);margin-bottom:34px;max-width:640px}
.pa-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.pa-card{border:1px solid var(--line);border-radius:12px;padding:22px;background:linear-gradient(180deg,var(--navy),transparent)}
.pa-card .num{font-family:'IBM Plex Mono',monospace;color:var(--gold);font-size:12px;margin-bottom:10px}
.pa-card h4{font-size:15.5px;margin-bottom:6px}
.pa-card p{font-size:12.5px;color:var(--mist)}
.dir-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.dir-card{border:1px solid var(--line);border-radius:12px;padding:20px;background:var(--navy);display:flex;gap:14px;align-items:center}
.dir-card h5{font-size:14.5px}
.dir-card .role{font-size:11px;color:var(--gold);letter-spacing:.08em;text-transform:uppercase;margin-top:2px}
.role-link{background:transparent;border:none;color:var(--gold);font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:0;margin-top:3px;border-bottom:1px dotted rgba(200,164,92,.6);font-weight:700}
.role-link:hover{color:#e2c688;border-bottom-style:solid}
.pa-card.click{cursor:pointer;transition:.16s}
.pa-card.click:hover{border-color:var(--gold);transform:translateY(-2px)}
.pa-card .more{font-size:11px;color:var(--gold);margin-top:10px;letter-spacing:.06em}
.doclist li{padding:9px 12px;border:1px solid var(--line);border-radius:8px;margin-bottom:7px;list-style:none;font-size:13.5px;display:flex;gap:10px;align-items:center}
.doclist li:before{content:"📄"}
.doclist.plain li:before{content:"›";color:var(--gold);font-weight:800}
.invite-preview{background:var(--ink);border:1px solid var(--line2);border-radius:10px;padding:14px 16px;font-size:12.5px;white-space:pre-wrap;color:#c9d2e2;font-family:'IBM Plex Mono',monospace;max-height:220px;overflow:auto}
.land-foot{margin-top:auto;padding:30px 6vw;border-top:1px solid var(--line);display:flex;justify-content:space-between;color:var(--mist);font-size:12px;flex-wrap:wrap;gap:10px}

/* ---------- login ---------- */
.login-wrap{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}
.login-left{background:linear-gradient(160deg,var(--navy) 0%,var(--black) 70%);padding:7vh 6vw;display:flex;flex-direction:column;justify-content:space-between;border-right:1px solid var(--line)}
.login-left h2{font-family:'Libre Caslon Text',serif;font-size:clamp(28px,3.4vw,44px);font-weight:400;line-height:1.18;max-width:520px}
.login-left h2 em{font-style:italic;color:#9db8ea}
.login-right{display:flex;align-items:center;justify-content:center;padding:40px}
.login-box{width:100%;max-width:420px}
.login-box h3{font-family:'Libre Caslon Text',serif;font-size:26px;font-weight:400;margin-bottom:6px}
.demo-accts{margin-top:22px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.demo-accts .hd{padding:10px 14px;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--mist);background:var(--navy);border-bottom:1px solid var(--line)}
.demo-accts button{display:flex;width:100%;align-items:center;gap:10px;background:transparent;border:none;border-bottom:1px solid var(--line);padding:10px 14px;color:#fff;text-align:left;transition:.15s}
.demo-accts button:last-child{border-bottom:none}
.demo-accts button:hover{background:var(--navy2)}
.demo-accts .r{font-size:11px;color:var(--gold)}

/* ---------- app shell ---------- */
.shell{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
.side{background:var(--ink);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow:auto}
.side .logo{display:flex;gap:11px;align-items:center;padding:6px 10px 18px;border-bottom:1px solid var(--line);margin-bottom:14px}
.side .logo .mark{width:34px;height:34px;border:1.5px solid var(--gold);display:flex;align-items:center;justify-content:center;font-family:'Libre Caslon Text',serif;font-size:14px;color:var(--gold);flex:none}
.side .logo .nm{font-family:'Libre Caslon Text',serif;font-size:14px;line-height:1.25}
.side .logo .sb{font-size:9px;letter-spacing:.24em;text-transform:uppercase;color:var(--mist)}
.navlab{font-size:9.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--mist);padding:12px 10px 5px}
.nav-item{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:9px;color:#c9d2e2;font-size:13.5px;font-weight:500;border:none;background:transparent;width:100%;text-align:left;transition:.14s;margin-bottom:2px}
.nav-item:hover{background:var(--navy);color:#fff}
.nav-item.on{background:var(--navy2);color:#fff;box-shadow:inset 2px 0 0 var(--gold)}
.nav-item .ic{width:18px;text-align:center;opacity:.85}
.side .me{margin-top:auto;border-top:1px solid var(--line);padding-top:14px;display:flex;align-items:center;gap:10px;padding-left:6px}
.side .me .who{min-width:0}
.side .me .who .n{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side .me .who .r{font-size:10.5px;color:var(--gold)}
.main{padding:30px 34px 60px;max-width:1180px;width:100%;margin:0 auto;min-width:0}
.page-hd{margin-bottom:26px}
.page-hd .crumb{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin-bottom:8px}
.page-hd h1{font-family:'Libre Caslon Text',serif;font-size:31px;font-weight:400}
.page-hd .sub{color:var(--mist);font-size:14px;margin-top:6px;max-width:720px}

/* ---------- dashboard ---------- */
.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:24px}
.stat{background:var(--navy);border:1px solid var(--line);border-radius:12px;padding:18px}
.stat .n{font-family:'Libre Caslon Text',serif;font-size:28px}
.stat .l{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mist);margin-top:2px}
.feed-item{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);font-size:13px}
.feed-item:last-child{border-bottom:none}
.feed-item .t{color:var(--mist);font-size:11px;white-space:nowrap}

/* ---------- deals ---------- */
.deal-card{background:var(--navy);border:1px solid var(--line);border-radius:14px;padding:22px;margin-bottom:14px;transition:.16s;cursor:pointer}
.deal-card:hover{border-color:var(--blue2);transform:translateY(-1px)}
.deal-card h3{font-family:'Libre Caslon Text',serif;font-size:20px;font-weight:400}
.vs-line{display:flex;align-items:center;gap:10px;margin:8px 0 12px;font-size:13.5px;color:var(--mist)}
.vs-line b{color:#fff}
.tabbar{display:flex;gap:4px;border-bottom:1px solid var(--line2);margin-bottom:22px;overflow-x:auto}
.tabbar button{background:transparent;border:none;color:var(--mist);padding:10px 16px;font-size:13.5px;font-weight:600;border-bottom:2px solid transparent;white-space:nowrap}
.tabbar button.on{color:#fff;border-bottom-color:var(--gold)}
.task{display:flex;align-items:flex-start;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;margin-bottom:9px;background:var(--ink)}
.task.done{opacity:.55}
.task input[type=checkbox]{width:17px;height:17px;margin-top:2px;accent-color:var(--blue2)}
.doc-row{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;background:var(--ink)}
.doc-ic{width:36px;height:42px;border:1px solid var(--line2);border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:15px;flex:none;background:var(--navy)}
.detail-card{border:1px solid var(--line);border-left:3px solid var(--mist);border-radius:10px;padding:16px;margin-bottom:10px;background:var(--ink)}
.detail-card.aid{border-left-color:var(--green)}
.detail-card.ruin{border-left-color:var(--red)}

/* ---------- chat ---------- */
.chat-layout{display:grid;grid-template-columns:220px 1fr;gap:16px;min-height:460px}
.room-list button{display:block;width:100%;text-align:left;background:transparent;border:1px solid var(--line);border-radius:10px;padding:11px 13px;color:#cdd6e5;margin-bottom:8px;font-size:13px;font-weight:600;transition:.14s}
.room-list button:hover{border-color:var(--blue2)}
.room-list button.on{background:var(--navy2);border-color:var(--blue2);color:#fff}
.room-list .rt{display:block;font-size:10px;color:var(--mist);font-weight:500;margin-top:2px;letter-spacing:.08em;text-transform:uppercase}
.chat-pane{border:1px solid var(--line);border-radius:14px;background:var(--ink);display:flex;flex-direction:column;min-height:460px;max-height:600px}
.chat-hd{padding:13px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.depo-banner{background:rgba(208,82,82,.14);border-bottom:1px solid rgba(208,82,82,.4);color:#eb9a9a;font-size:11.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;padding:7px 18px;display:flex;align-items:center;gap:8px}
.depo-banner .dot{width:8px;height:8px;border-radius:50%;background:var(--red);animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.chat-msgs{flex:1;overflow-y:auto;padding:18px}
.msg{display:flex;gap:11px;margin-bottom:16px}
.msg .bubble{background:var(--navy);border:1px solid var(--line);border-radius:12px;padding:10px 14px;max-width:76%}
.msg.mine{flex-direction:row-reverse}
.msg.mine .bubble{background:var(--navy3);border-color:rgba(58,99,184,.4)}
.msg .who{font-size:11.5px;font-weight:700;margin-bottom:3px;display:flex;gap:8px;align-items:baseline}
.msg .who .rl{font-size:9.5px;color:var(--gold);letter-spacing:.08em;text-transform:uppercase;font-weight:700}
.msg .txt{font-size:13.5px;white-space:pre-wrap;word-break:break-word}
.msg .ts{font-size:10px;color:var(--mist);margin-top:4px}
.msg.sys .bubble{background:transparent;border:1px dashed var(--line2);max-width:100%;width:100%;text-align:center;color:var(--mist);font-size:12px}
.msg.depo .bubble{border-left:3px solid var(--red)}
.chat-in{border-top:1px solid var(--line);padding:12px;display:flex;gap:10px}
.chat-in textarea{flex:1;background:var(--navy);border:1px solid var(--line2);border-radius:10px;color:#fff;padding:10px 13px;resize:none;height:44px;outline:none}
.chat-in textarea:focus{border-color:var(--blue2)}

/* ---------- chatbot ---------- */
.bot-wrap{display:grid;grid-template-columns:1fr 280px;gap:18px;align-items:start}
.bot-pane{border:1px solid var(--line);border-radius:16px;background:var(--ink);display:flex;flex-direction:column;height:640px}
.bot-msgs{flex:1;overflow-y:auto;padding:22px}
.bmsg{display:flex;gap:12px;margin-bottom:18px}
.bmsg .b-av{width:34px;height:34px;border-radius:9px;flex:none;display:flex;align-items:center;justify-content:center;font-size:15px}
.bmsg.bot .b-av{background:var(--navy3);border:1px solid var(--blue2)}
.bmsg.user .b-av{background:var(--navy);border:1px solid var(--line2)}
.bmsg .b-body{max-width:82%}
.bmsg .b-body .content{background:var(--navy);border:1px solid var(--line);border-radius:12px;padding:12px 16px;font-size:13.5px}
.bmsg.user .b-body .content{background:var(--navy3)}
.bmsg .content p{margin-bottom:8px}
.bmsg .content p:last-child{margin-bottom:0}
.bmsg .content ul{margin:6px 0 8px 18px}
.bmsg .content li{margin-bottom:4px}
.bmsg .content b{color:#bcd0f0}
.sugg{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}
.sugg button{background:transparent;border:1px solid var(--line2);color:#c9d2e2;border-radius:999px;padding:5px 12px;font-size:11.5px;transition:.14s}
.sugg button:hover{border-color:var(--blue2);color:#fff}
.disc{font-size:10.5px;color:var(--mist);text-align:center;padding:8px 16px;border-top:1px solid var(--line)}

/* ---------- slides ---------- */
.slide-stage{border:1px solid var(--line2);border-radius:18px;background:linear-gradient(155deg,var(--navy) 0%,var(--ink) 80%);min-height:480px;padding:52px 58px;display:flex;flex-direction:column;position:relative;overflow:hidden}
.slide-stage .sl-kick{font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--gold);margin-bottom:18px}
.slide-stage h2{font-family:'Libre Caslon Text',serif;font-size:32px;font-weight:400;margin-bottom:22px;max-width:700px}
.slide-stage .sl-body{font-size:15px;max-width:760px}
.slide-stage .sl-body ul{margin:2px 0 14px 20px}
.slide-stage .sl-body li{margin-bottom:9px}
.slide-stage .sl-body b{color:#bcd0f0}
.slide-stage .sl-num{position:absolute;bottom:24px;right:30px;font-family:'IBM Plex Mono',monospace;color:var(--mist);font-size:12px}
.slide-ctrl{display:flex;align-items:center;justify-content:space-between;margin-top:16px}
.slide-dots{display:flex;gap:6px;flex-wrap:wrap}
.slide-dots button{width:9px;height:9px;border-radius:50%;border:none;background:var(--navy3);transition:.15s}
.slide-dots button.on{background:var(--gold);transform:scale(1.25)}

/* ---------- doc viewer ---------- */
.doc-view{background:#fdfdfb;color:#1a1c22;border-radius:12px;padding:38px 44px;font-size:13.5px;max-height:60vh;overflow:auto}
.doc-view h2{font-family:'Libre Caslon Text',serif;font-size:21px;text-align:center;margin-bottom:4px;color:#111}
.doc-view h3{font-size:13px;letter-spacing:.1em;text-transform:uppercase;margin:18px 0 6px;color:#333}
.doc-view p{margin-bottom:10px;line-height:1.65}
.doc-view .cl{margin-bottom:10px}
.doc-view .cl b{color:#000}
.ver-toggle{display:inline-flex;border:1px solid var(--line2);border-radius:9px;overflow:hidden}
.ver-toggle button{background:transparent;border:none;color:var(--mist);padding:7px 14px;font-size:12px;font-weight:700}
.ver-toggle button.on{background:var(--blue);color:#fff}

/* ---------- case type menu ---------- */
.ct-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.ct-card{border:1px solid var(--line);border-radius:12px;padding:16px;background:var(--ink);cursor:pointer;transition:.15s;text-align:left}
.ct-card:hover{border-color:var(--gold);transform:translateY(-2px)}
.ct-card.locked{opacity:.45;cursor:not-allowed}
.ct-card .ic{font-size:24px;margin-bottom:6px}
.ct-card h4{font-size:14px;margin-bottom:4px}
.ct-card p{font-size:11.5px;color:var(--mist);margin-bottom:8px}
.diff{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:800;padding:2px 7px;border-radius:5px}
.diff.easy{background:rgba(63,174,122,.18);color:#7dd6ac}
.diff.medium{background:rgba(217,164,65,.18);color:#eec581}
.diff.hard{background:rgba(208,82,82,.18);color:#eb9a9a}
.msg.opp .bubble{border-left:3px solid var(--blue2)}
.score-pill{display:inline-flex;gap:8px;font-size:10px;color:var(--mist);margin-top:4px;flex-wrap:wrap}
.score-pill span b{color:#bcd0f0}
/* ---------- ledger ---------- */
.bal-hero{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap}
.bal-hero .amt{font-family:'Libre Caslon Text',serif;font-size:54px;line-height:1}
.bal-hero .amt.neg{color:var(--red)}
.tx-table{width:100%;border-collapse:collapse;font-size:13px}
.tx-table th{text-align:left;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mist);padding:8px 10px;border-bottom:1px solid var(--line2)}
.tx-table td{padding:10px;border-bottom:1px solid var(--line)}
.tx-table .pos{color:#7dd6ac;font-weight:700}.tx-table .negv{color:#eb9a9a;font-weight:700}
.chart-wrap{background:var(--ink);border:1px solid var(--line);border-radius:12px;padding:14px}
/* ---------- rating ---------- */
.rate-hero{text-align:center;padding:34px 20px 26px}
.rate-hero .big{font-family:'Libre Caslon Text',serif;font-size:74px;line-height:1}
.rate-hero .big span{font-size:26px;color:var(--mist)}
.rate-bars{max-width:640px;margin:0 auto}
.rate-bar{margin-bottom:14px}
.rate-bar .lbl{display:flex;justify-content:space-between;font-size:12.5px;font-weight:600;margin-bottom:5px}
.rate-bar .trk{height:9px;background:var(--ink);border:1px solid var(--line);border-radius:99px;overflow:hidden}
.rate-bar .fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--blue),var(--blue2))}

@media(max-width:960px){
  .shell{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;bottom:0;z-index:150;width:250px;transform:translateX(-100%);transition:.22s}
  .side.open{transform:translateX(0)}
  .main{padding:20px 16px 60px}
  .login-wrap{grid-template-columns:1fr}
  .login-left{display:none}
  .grid2,.grid3{grid-template-columns:1fr}
  .chat-layout{grid-template-columns:1fr}
  .bot-wrap{grid-template-columns:1fr}
  .slide-stage{padding:34px 26px}
  #burger{display:flex!important}
}
#burger{display:none;position:fixed;top:14px;left:14px;z-index:160;width:42px;height:42px;border-radius:10px;background:var(--navy2);border:1px solid var(--line2);color:#fff;align-items:center;justify-content:center;font-size:18px}
</style>

function isPartner(u){ return u && ROLES[u.role] && ROLES[u.role].rank >= 3; }
function isMP(u){ return u && u.role === 'managing_partner'; }

/* ---------- ROLE EXPLAINERS (what each role does in the simulator) ---------- */
const ROLE_INFO = {
  managing_partner:{t:"Managing Partner",tag:"Runs the firm and the simulation",pts:[

/* ---------- PRACTICE AREA → sample documents (names only, not exhaustive) ---------- */
const PA_DOC_SETS = [
  {k:["merger","m&a","acquisition"], docs:["Non-Disclosure Agreement (NDA)","Letter of Intent (LOI)","Term Sheet","Share Purchase Agreement (SPA)","Asset Purchase Agreement (APA)","Disclosure Schedules","Escrow Agreement","Closing Checklist"]},
  {k:["governance","board"], docs:["Board Consent / Resolutions","Certificate of Incorporation","Bylaws","Committee Charters","D&O Questionnaire","Stockholder Consent","Indemnification Agreement"]},
  {k:["securities","capital"], docs:["Private Placement Memorandum","Subscription Agreement","Investor Rights Agreement","Stock Purchase Agreement (financing)","Form 8-K Summary","Registration Rights Agreement"]},
  {k:["diligence","risk"], docs:["Due Diligence Request List","Data Room Index","Diligence Report / Red-Flag Memo","Disclosure Schedules","Change-of-Control Summary","Litigation & Tax Exposure Memo"]},
  {k:["contract","commercial"], docs:["Non-Disclosure Agreement (NDA)","Master Services Agreement (MSA)","Statement of Work (SOW)","Supply Agreement","License Agreement","Amendment & Assignment Forms"]},
  {k:["antitrust","regulatory"], docs:["HSR Notification Filing","Second Request Response Plan","Regulatory Approval Tracker","Divestiture Agreement","Timing Agreement","Clean Team Agreement"]}
];
function paDocs(title){
  const t=(title||"").toLowerCase();
  for(const s of PA_DOC_SETS){ if(s.k.some(k=>t.includes(k))) return s.docs; }
  return ["Non-Disclosure Agreement (NDA)","Letter of Intent (LOI)","Definitive Purchase Agreement","Disclosure Schedules","Escrow Agreement","Closing Checklist"];
}

/* ---------- RIVAL FIRMS (public leaderboard — fictional, they chose to publicize) ---------- */
const RIVAL_FIRMS = [
  {name:"Sterling & Vane LLP", deals:12, avg:8.4, best:{code:"Project Aurora", score:9.3}},
  {name:"Blackwell Chambers", deals:9, avg:7.9, best:{code:"Project Kestrel", score:8.8}},
  {name:"Harrow & Finch", deals:15, avg:7.2, best:{code:"Project Granite", score:8.5}},
  {name:"Meridian Legal Group", deals:7, avg:6.8, best:{code:"Project Cobalt", score:7.9}},
  {name:"Court Street Collective", deals:11, avg:6.1, best:{code:"Project Ember", score:7.4}}

/* ---------- SELF-STUDY TRACKS (keys reference GLOSSARY) ---------- */
const STUDY_TRACKS = [
  {t:"Deal Documents", icon:"📜", keys:["nda","loi","term sheet","spa","apa","disclosure schedule","escrow"]},

  {t:"Process & Regulators", icon:"🏛️", keys:["due diligence","exclusivity","hsr","antitrust","second request","ordinary course","bring-down"]},
  {t:"Doctrine & Disputes", icon:"⚖️", keys:["fiduciary duties","business judgment rule","revlon","poison pill","tender offer","hostile takeover","deposition","discovery","privilege","delaware"]}
];

/* ---------- CERTIFICATION QUIZZES (one per study track; pass = 3 of 4) ---------- */
const QUIZZES = [
[ // Deal Documents
 {q:"A buyer and target are about to share financials for the first time. Which document gets signed first?",o:["Share Purchase Agreement","Non-Disclosure Agreement","Escrow Agreement","Board Consent"],a:1},
 {q:"An LOI is described as 'non-binding' — but which clause in it typically IS binding?",o:["The purchase price","The closing date","Exclusivity","The earnout formula"],a:2},
 {q:"The key difference in a stock deal (SPA) versus an asset deal (APA) is that the stock buyer gets:",o:["Only the assets it lists","A better tax basis automatically","The whole company, unknown liabilities included","No need for board approval"],a:2},
 {q:"Disclosure schedules exist to:",o:["List the seller's exceptions to its reps and warranties","Summarize the deal for regulators","Set the closing agenda","Replace due diligence"],a:0}
],
[ // Deal Economics
 {q:"An earnout is:",o:["A closing bonus for the bankers","Contingent purchase price paid only if the target hits agreed milestones","The escrow release payment","A break-up fee"],a:1},
 {q:"A typical escrow arrangement holds:",o:["100% of the price for 5 years","A signing deposit paid to the seller's CEO","5–15% of the price with a neutral bank for 12–24 months","The buyer's legal fees"],a:2},
 {q:"A 'tipping basket' means:",o:["Claims are never payable","Once losses cross the threshold, the seller pays from dollar one","Only fraud claims count","The cap increases annually"],a:1},
 {q:"The working capital adjustment compares closing working capital against:",o:["An agreed peg","Last year's revenue","The escrow amount","The buyer's cash on hand"],a:0}
],
[ // Risk & Protection
 {q:"Representations and warranties function mainly to:",o:["Decorate the contract","Allocate information risk between the parties","Satisfy the IRS","Replace the disclosure schedules"],a:1},
 {q:"Delaware courts have historically treated MAC clauses as:",o:["Automatic exits for buyers","Unenforceable","A narrow escape hatch that rarely succeeds","Applying only to market downturns"],a:2},
 {q:"If a seller committed actual fraud, the negotiated indemnity caps usually:",o:["Still protect the seller","Double","Get pierced — fraud strips the limits","Convert to an earnout"],a:2},
 {q:"The 'bring-down' condition at closing requires:",o:["Lowering the price","The seller's reps to still be true as of the closing date","Delivering the escrow early","A new board vote"],a:1}
],
[ // Process & Regulators
 {q:"The HSR Act requires parties to large deals to:",o:["Get shareholder approval first","Notify the FTC/DOJ and observe a waiting period before closing","Publish the price publicly","Use a Delaware escrow agent"],a:1},
 {q:"A 'Second Request' from the antitrust agencies typically:",o:["Ends the review within a week","Blocks the deal permanently","Extends review substantially — often 6–12 months","Only applies to foreign buyers"],a:2},
 {q:"Exclusivity (no-shop) clauses primarily protect:",o:["The target's employees","The buyer's investment of time and fees in the deal","The escrow agent","The regulators"],a:1},
 {q:"The 'ordinary course' covenant between signing and closing requires the seller to:",o:["Freeze all operations","Run the business as usual, consistent with past practice","Maximize dividends","Renegotiate customer contracts"],a:1}
],
[ // Doctrine & Disputes
 {q:"Revlon duties mean that once a sale of control is inevitable, the board must:",o:["Defend the company at all costs","Seek the best price reasonably available for shareholders","Resign","Accept the first bid"],a:1},
 {q:"The business judgment rule leads courts to:",o:["Second-guess every board decision","Defer to informed, disinterested, good-faith board decisions","Require unanimous votes","Apply only to private companies"],a:1},
 {q:"A poison pill works by:",o:["Suing the hostile bidder","Letting other shareholders buy discounted shares, diluting the bidder","Paying the bidder to leave","Moving the company offshore"],a:1},
 {q:"A deposition is:",o:["A closing document","Sworn out-of-court testimony taken during discovery","A board resolution","A type of escrow claim"],a:1}
]
];
const QUIZ_PASS = 3;

/* ---------- DOCUMENT TEMPLATES (dual version) ---------- */
const DOC_TEMPLATES = [
{
id:"nda", name:"Non-Disclosure Agreement (NDA)", cat:"Preliminary Agreements", icon:"🤐",
about:"Signed before any real information changes hands. Protects confidential material shared during deal talks.",
simplified:`<h2>Non-Disclosure Agreement</h2><h3>Simplified Training Version</h3>
<p><b>Who:</b> [Acquirer] and [Target] ("the Parties").</p>

<div class="cl"><b>4. How long.</b> The secrecy promise lasts [2] years, even if the deal dies.</div>

<div class="cl"><b>6. No deal yet.</b> Signing this does NOT mean anyone has agreed to buy or sell anything.</div>
<p><b>Signatures:</b> ______________ / ______________</p>`,
realistic:`<h2>MUTUAL NON-DISCLOSURE AGREEMENT</h2>
<p>This Mutual Non-Disclosure Agreement (this "<b>Agreement</b>") is entered into as of [DATE] (the "<b>Effective Date</b>"), by and between [ACQUIRER], a Delaware corporation ("<b>Acquirer</b>"), and [TARGET], a Delaware corporation ("<b>Company</b>" and, together with Acquirer, the "<b>Parties</b>").</p>
<h3>1. Confidential Information</h3><p>"Confidential Information" means all non-public information, whether written, oral, electronic, or visual, disclosed by a Party or its Representatives in connection with a possible negotiated transaction between the Parties (the "<b>Transaction</b>"), including business plans, financial statements, projections, customer and supplier data, trade secrets, and the existence and status of discussions. Confidential Information shall not include information that (a) is or becomes generally available to the public other than through breach hereof; (b) was in the Receiving Party's possession prior to disclosure; (c) is independently developed without use of Confidential Information; or (d) is lawfully received from a third party not under a duty of confidentiality.</p>
<h3>2. Non-Use; Non-Disclosure</h3><p>The Receiving Party shall use Confidential Information solely to evaluate, negotiate, and consummate the Transaction and shall disclose it only to its directors, officers, employees, counsel, accountants, and financing sources (collectively, "<b>Representatives</b>") who need to know such information, provided such Representatives are bound by confidentiality obligations no less restrictive than those herein. The Receiving Party shall be liable for breaches by its Representatives.</p>

<h3>4. Term; Return of Materials</h3><p>The obligations hereunder shall survive for a period of two (2) years from the Effective Date. Upon written request, the Receiving Party shall promptly return or destroy all Confidential Information, provided that one archival copy may be retained solely for legal compliance purposes.</p>
<h3>5. No Obligation; No License</h3><p>Nothing herein obligates either Party to proceed with the Transaction, and no license or other rights in any intellectual property are granted hereby.</p>
<h3>6. Remedies; Governing Law</h3><p>The Parties agree that money damages may be an insufficient remedy for breach and that the Disclosing Party shall be entitled to seek equitable relief, including injunction and specific performance, without posting bond. This Agreement shall be governed by the laws of the State of Delaware, without regard to conflicts-of-law principles.</p>

{

<p><b>CONFIDENTIAL</b> — [DATE]</p>
<p>Board of Directors, [TARGET]</p>
<p>Ladies and Gentlemen: This letter (this "<b>LOI</b>") sets forth the principal terms upon which [ACQUIRER] ("<b>Buyer</b>") proposes to acquire [TARGET] (the "<b>Company</b>") in a negotiated transaction (the "<b>Proposed Transaction</b>").</p>
<h3>1. Structure; Consideration</h3><p>Buyer proposes to acquire one hundred percent (100%) of the issued and outstanding capital stock of the Company for aggregate consideration of $[AMOUNT], subject to customary adjustments for cash, indebtedness, transaction expenses, and net working capital relative to an agreed target, payable [ ]% in cash at closing and [ ]% in Buyer common stock.</p>

<p>Very truly yours,<br>[ACQUIRER]</p>`

<div class="cl"><b>Purchase Price:</b> $[AMOUNT] on a cash-free, debt-free basis, subject to a customary net working capital adjustment against a peg of $[X], determined per the Accounting Principles set forth in the SPA.</div>

<div class="cl"><b>Conditions Precedent:</b> (i) completion of confirmatory due diligence; (ii) expiration or termination of any applicable HSR waiting period and receipt of required regulatory approvals; (iii) absence of a Material Adverse Effect; (iv) execution of restrictive covenant and employment agreements by Key Employees; (v) receipt of specified third-party consents.</div>
<div class="cl"><b>Representations & Warranties:</b> Customary for transactions of this size and type, including capitalization, financial statements (GAAP), undisclosed liabilities, taxes, material contracts, IP ownership, compliance with law, and litigation, qualified by Disclosure Schedules.</div>
<div class="cl"><b>Indemnification:</b> Survival of 18 months for general reps (6 years for fundamental reps and taxes); indemnity basket of 0.75% of Purchase Price (tipping); cap of 10% of Purchase Price for general reps; escrow as primary (non-exclusive) source of recovery.</div>
<div class="cl"><b>Covenants:</b> Ordinary-course operation of the business between signing and closing; no leakage; non-competition (4 years) and non-solicitation (3 years) from principal sellers.</div>
<div class="cl"><b>Exclusivity / Expenses / Governing Law:</b> 60-day exclusivity; each party bears its own expenses; Delaware law; disputes to the Delaware Court of Chancery.</div>`

{
id:"spa", name:"Share Purchase Agreement (SPA)", cat:"Definitive Agreements", icon:"📜",
about:"The definitive contract in a stock deal: buyer purchases the target's shares, taking the whole company with all its assets and liabilities.",
simplified:`<h2>Share Purchase Agreement</h2><h3>Simplified Training Version</h3>
<div class="cl"><b>1. The sale.</b> The shareholders of [Target] sell ALL of their shares to [Acquirer]. Buying the shares means buying the entire company, including its debts and problems.</div>
<div class="cl"><b>2. Price.</b> $[X] at closing, adjusted for how much cash and debt the company actually has that day.</div>
<div class="cl"><b>3. Promises (reps & warranties).</b> Sellers promise: the financials are honest, they own the shares, taxes are paid, no secret lawsuits, contracts are valid. Buyer promises: it has the money and authority to buy.</div>
<div class="cl"><b>4. The disclosure schedules.</b> A giant appendix where sellers list every exception ("actually, there IS one lawsuit — see Schedule 3.8").</div>
<div class="cl"><b>5. Between signing and closing.</b> Sellers run the company normally. No selling assets, raising salaries wildly, or taking new loans without permission.</div>
<div class="cl"><b>6. Conditions to close.</b> Regulators say yes, promises still true, no disasters (MAC), key consents obtained.</div>
<div class="cl"><b>7. If promises were false.</b> Buyer can claim compensation (indemnification), usually from the escrow account first, subject to deductibles and caps.</div>
<div class="cl"><b>8. Walking away.</b> Either side can terminate if closing hasn't happened by the "drop-dead date" or if the other side seriously breaches.</div>`,
realistic:`<h2>SHARE PURCHASE AGREEMENT</h2>
<p>This SHARE PURCHASE AGREEMENT (this "<b>Agreement</b>"), dated as of [DATE], is made by and among [ACQUIRER] ("<b>Buyer</b>"), the persons listed on Schedule A (each a "<b>Seller</b>"), and [TARGET] (the "<b>Company</b>").</p>
<h3>Article I — Purchase and Sale</h3><p>Upon the terms and subject to the conditions hereof, at the Closing each Seller shall sell, transfer, and deliver to Buyer, and Buyer shall purchase from each Seller, all of such Seller's Shares, free and clear of all Liens, constituting in the aggregate one hundred percent (100%) of the issued and outstanding capital stock of the Company.</p>
<h3>Article II — Purchase Price; Adjustments</h3><p>The aggregate consideration shall be $[AMOUNT] (the "<b>Base Purchase Price</b>"), (i) increased by Closing Cash, (ii) decreased by Closing Indebtedness and unpaid Transaction Expenses, and (iii) adjusted dollar-for-dollar by the amount by which Closing Net Working Capital exceeds or falls short of the Target Working Capital. An Escrow Amount equal to $[X] shall be deposited with the Escrow Agent pursuant to the Escrow Agreement.</p>
<h3>Article III — Representations and Warranties of Sellers</h3><p>Except as set forth in the Disclosure Schedules, each Seller and the Company jointly and severally represent and warrant: (3.1) due organization and good standing; (3.2) capitalization and title to Shares; (3.3) authority and enforceability; (3.4) no conflicts or required consents; (3.5) Financial Statements prepared in accordance with GAAP fairly presenting the Company's condition; (3.6) absence of undisclosed liabilities; (3.7) tax matters; (3.8) litigation; (3.9) material contracts; (3.10) intellectual property; (3.11) compliance with Laws; (3.12) absence of Material Adverse Effect since the Balance Sheet Date.</p>
<h3>Article IV — Representations and Warranties of Buyer</h3><p>Buyer represents and warrants due organization, authority, no conflicts, sufficiency of funds, and that it is acquiring the Shares for investment.</p>
<h3>Article V — Covenants</h3><p>From the date hereof until Closing, the Company shall conduct its business only in the Ordinary Course of Business and shall not, without Buyer's prior written consent: amend organizational documents; issue securities; incur Indebtedness; dispose of material assets; increase compensation outside the ordinary course; or settle material litigation. The Parties shall use reasonable best efforts to obtain all Consents and Regulatory Approvals, including filings under the HSR Act within ten (10) Business Days.</p>
<h3>Article VI — Conditions to Closing</h3><p>The obligations of Buyer to consummate the Closing are subject to: (a) accuracy of Sellers' representations (subject to Material Adverse Effect qualifications); (b) performance of covenants in all material respects; (c) expiration or termination of the HSR waiting period; (d) no Governmental Order restraining the transactions; (e) absence of a Material Adverse Effect; and (f) delivery of the closing deliverables set forth in Section 7.2.</p>
<h3>Article VII — Indemnification</h3><p>Subject to the limitations herein (including a deductible of $[X], a cap equal to the Escrow Amount for general representations, and survival of eighteen (18) months, except Fundamental Representations and Taxes which survive six (6) years), Sellers shall indemnify Buyer Indemnitees for Losses arising from breaches of representations, warranties, and covenants and from Pre-Closing Taxes. Recovery shall first be sought from the Escrow Fund.</p>
<h3>Article VIII — Termination</h3><p>This Agreement may be terminated (a) by mutual consent; (b) by either Party if the Closing has not occurred by [OUTSIDE DATE]; (c) by either Party upon a final non-appealable Governmental Order; or (d) by the non-breaching Party upon an uncured material breach. Termination pursuant to certain sections shall obligate the breaching party to pay a termination fee of $[X].</p>
<h3>Article IX — Miscellaneous</h3><p>Governing law: Delaware. Exclusive jurisdiction: Delaware Court of Chancery. This Agreement, together with the Disclosure Schedules and Ancillary Agreements, constitutes the entire agreement of the Parties.</p>`
},
{
id:"apa", name:"Asset Purchase Agreement (APA)", cat:"Definitive Agreements", icon:"🏗️",
about:"The definitive contract in an asset deal: buyer picks the assets (and only the liabilities) it wants.",
simplified:`<h2>Asset Purchase Agreement</h2><h3>Simplified Training Version</h3>
<div class="cl"><b>1. Cherry-picking.</b> Instead of buying the whole company, [Acquirer] buys specific assets: equipment, contracts, brand names, customer lists. Anything not listed stays behind.</div>
<div class="cl"><b>2. Liabilities.</b> Buyer takes ONLY the debts it explicitly agrees to ("assumed liabilities"). Old lawsuits and surprise debts stay with the seller — this is the big advantage of an asset deal.</div>
<div class="cl"><b>3. Price and allocation.</b> $[X], divided among the assets for tax purposes (the IRS cares how much was for equipment vs. goodwill).</div>
<div class="cl"><b>4. Contracts need consent.</b> Many contracts can't just be handed over — the other party to each contract may need to approve the transfer.</div>
<div class="cl"><b>5. Employees.</b> Buyer chooses which employees to offer jobs to. They technically quit the seller and get hired by the buyer.</div>
<div class="cl"><b>6. Same guardrails.</b> Reps & warranties, disclosure schedules, closing conditions, and indemnification work like in a share deal.</div>`,
realistic:`<h2>ASSET PURCHASE AGREEMENT</h2>
<p>This ASSET PURCHASE AGREEMENT (this "<b>Agreement</b>"), dated as of [DATE], is by and between [TARGET] ("<b>Seller</b>") and [ACQUIRER] ("<b>Buyer</b>").</p>
<h3>Article I — Purchase and Sale of Assets</h3><p>Seller shall sell, convey, assign, and deliver to Buyer, free and clear of all Liens other than Permitted Liens, all of Seller's right, title, and interest in the Purchased Assets, including: (a) the tangible personal property listed on Schedule 1.1(a); (b) the Assigned Contracts; (c) the Intellectual Property Assets; (d) accounts receivable; (e) permits to the extent transferable; and (f) goodwill. The Purchased Assets shall exclude the Excluded Assets set forth on Schedule 1.2, including cash, corporate records, and rights under this Agreement.</p>
<h3>Article II — Assumed and Excluded Liabilities</h3><p>Buyer shall assume only the Assumed Liabilities specifically identified on Schedule 2.1, consisting of obligations under Assigned Contracts arising after the Closing and ordinary-course trade payables reflected in the Closing Working Capital. All other liabilities of Seller, including Pre-Closing Taxes, Indebtedness, litigation, and employee-related liabilities arising prior to Closing, shall constitute Excluded Liabilities and remain the sole responsibility of Seller.</p>
<h3>Article III — Purchase Price; Allocation</h3><p>The aggregate purchase price shall be $[AMOUNT], subject to a net working capital adjustment. The Parties shall allocate the Purchase Price among the Purchased Assets in accordance with Section 1060 of the Internal Revenue Code and the methodology on Schedule 3.3, and shall file all Tax Returns consistently therewith.</p>
<h3>Article IV — Consents; Non-Assignable Assets</h3><p>To the extent any Assigned Contract is not assignable without third-party consent, this Agreement shall not constitute an assignment thereof absent such consent, and the Parties shall cooperate in lawful arrangements to provide Buyer the economic benefits thereof pending receipt of consent.</p>
<h3>Article V — Employees</h3><p>Buyer may, but shall not be obligated to, offer employment to the employees listed on Schedule 5.1 effective as of the Closing. Seller shall be responsible for all wages, accrued benefits, and severance obligations arising on or prior to the Closing Date, including any obligations arising under the WARN Act by reason of the transactions contemplated hereby.</p>
<h3>Article VI — Representations, Warranties, and Covenants</h3><p>Seller makes customary representations regarding organization, authority, title to assets, condition and sufficiency of assets, financial information, material contracts, IP, compliance, and litigation, in each case subject to the Disclosure Schedules. Between signing and Closing, Seller shall operate the Business in the Ordinary Course and preserve relationships with customers and suppliers.</p>
<h3>Article VII — Closing Conditions; Indemnification; Miscellaneous</h3><p>Closing is conditioned on accuracy of representations, receipt of Required Consents, and absence of a Material Adverse Effect. Indemnification follows the structure set forth in Article VII of the SPA form, with Excluded Liabilities indemnified without regard to basket or cap. Delaware law governs.</p>`
},
{
id:"disclosure", name:"Disclosure Schedules", cat:"Closing Deliverables", icon:"🗂️",
about:"The exceptions appendix to the purchase agreement — where the seller lists everything that contradicts its promises.",
simplified:`<h2>Disclosure Schedules</h2><h3>Simplified Training Version</h3>
<p>Think of the purchase agreement as the seller saying "everything is perfect," and the disclosure schedules as the honest footnotes saying "...except these things."</p>
<div class="cl"><b>Schedule 3.5 — Financial exceptions.</b> "Q3 revenue includes a one-time $2M licensing payment that will not recur."</div>
<div class="cl"><b>Schedule 3.7 — Taxes.</b> "The company is under a state sales tax audit in [State] for 2024."</div>
<div class="cl"><b>Schedule 3.8 — Litigation.</b> "A former employee filed a wrongful termination claim on [date]; exposure estimated under $[X]."</div>
<div class="cl"><b>Schedule 3.9 — Material contracts.</b> "The supply agreement with [Vendor] expires in 6 months and has not been renewed."</div>
<div class="cl"><b>Schedule 3.10 — IP.</b> "Two engineers who wrote core code never signed IP assignment agreements."</div>
<p><b>Why it matters:</b> if a problem is disclosed on a schedule, the buyer usually can't later claim compensation for it. Diligence associates live in these schedules.</p>`,
realistic:`<h2>DISCLOSURE SCHEDULES</h2>
<p>Delivered pursuant to that certain Share Purchase Agreement, dated as of [DATE], by and among [ACQUIRER], the Sellers party thereto, and [TARGET]. Capitalized terms used but not defined herein have the meanings ascribed in the Agreement. Disclosure of any item shall be deemed disclosure against any other representation to which its relevance is reasonably apparent on its face. Disclosure of an item shall not be deemed an admission of materiality.</p>
<h3>Schedule 3.4 — Consents</h3><p>1. Consent of [Landlord] required under the Master Lease dated [DATE] upon a change of control. 2. Notice to [Lender] required under the Credit Agreement dated [DATE].</p>
<h3>Schedule 3.5 — Financial Statements Exceptions</h3><p>1. The unaudited interim financial statements do not contain footnote disclosures required by GAAP and are subject to normal year-end adjustments. 2. Revenue for Q3 FY[YEAR] includes a non-recurring license fee of $2,000,000 from [Counterparty].</p>
<h3>Schedule 3.7 — Tax Matters</h3><p>1. The Company is currently subject to a sales and use tax audit by the [STATE] Department of Revenue for tax years 2023–2024. No assessment has been issued as of the date hereof.</p>
<h3>Schedule 3.8 — Litigation</h3><p>1. [Former Employee] v. the Company, Case No. [X], [Court], filed [DATE], alleging wrongful termination; the Company disputes the claims and estimates exposure not to exceed $[X]. 2. Demand letter received [DATE] from [Competitor] alleging misappropriation of trade secrets; no action filed.</p>
<h3>Schedule 3.9 — Material Contracts</h3><p>1. Amended and Restated Supply Agreement with [Vendor], expiring [DATE]; renewal negotiations ongoing. 2. Customer Agreement with [Key Customer] containing a most-favored-nation pricing clause. 3. Credit Agreement with [Lender] containing change-of-control acceleration provisions.</p>
<h3>Schedule 3.10 — Intellectual Property</h3><p>1. Two former contractors involved in the development of the [Product] codebase did not execute invention assignment agreements; the Company is pursuing confirmatory assignments. 2. The registered trademark [MARK] is subject to a pending opposition proceeding, No. [X].</p>`
},
{
id:"escrow", name:"Escrow Agreement", cat:"Closing Deliverables", icon:"🏦",
about:"A neutral bank holds back part of the price to cover post-closing claims against the seller.",
simplified:`<h2>Escrow Agreement</h2><h3>Simplified Training Version</h3>
<div class="cl"><b>1. The setup.</b> At closing, $[X] of the purchase price does NOT go to the sellers. It goes into a locked account at [Bank], the neutral "escrow agent."</div>
<div class="cl"><b>2. Why.</b> If the buyer later discovers the sellers broke a promise (say, a hidden lawsuit), the buyer claims money from this account instead of chasing individual sellers.</div>
<div class="cl"><b>3. How claims work.</b> Buyer sends a written claim describing the problem and amount. Sellers have [30] days to object. If they object, the parties negotiate or a court decides.</div>
<div class="cl"><b>4. The release date.</b> After [18] months, whatever money is left (minus pending claims) is released to the sellers.</div>
<div class="cl"><b>5. The agent is neutral.</b> The bank only follows joint written instructions or court orders. It doesn't referee disputes.</div>`,
realistic:`<h2>ESCROW AGREEMENT</h2>
<p>This ESCROW AGREEMENT (this "<b>Agreement</b>"), dated as of [CLOSING DATE], is by and among [ACQUIRER] ("<b>Buyer</b>"), [SELLERS' REPRESENTATIVE], solely in its capacity as representative of the Sellers ("<b>Sellers' Representative</b>"), and [BANK], as escrow agent (the "<b>Escrow Agent</b>").</p>
<h3>1. Establishment of Escrow</h3><p>At the Closing, Buyer shall deposit $[ESCROW AMOUNT] (the "<b>Escrow Fund</b>") with the Escrow Agent by wire transfer of immediately available funds. The Escrow Agent shall hold the Escrow Fund in a segregated, interest-bearing account and shall not disburse any portion thereof except in accordance with this Agreement.</p>
<h3>2. Claims Procedure</h3><p>If Buyer asserts a claim for indemnification under Article VII of the Purchase Agreement, Buyer shall deliver to the Escrow Agent and the Sellers' Representative a certificate specifying in reasonable detail the basis and amount of such claim (a "<b>Claim Notice</b>"). Unless the Sellers' Representative delivers a written objection within thirty (30) days of receipt, the Escrow Agent shall disburse the claimed amount to Buyer. Upon timely objection, the Escrow Agent shall retain the disputed amount pending (a) joint written instructions or (b) a final, non-appealable order of a court of competent jurisdiction.</p>
<h3>3. Release</h3><p>On the date that is eighteen (18) months after the Closing Date (the "<b>Release Date</b>"), the Escrow Agent shall release to the Sellers' Representative, for distribution to the Sellers, the balance of the Escrow Fund less the aggregate amount of any pending unresolved claims, which retained amounts shall be released upon final resolution.</p>
<h3>4. Duties of the Escrow Agent</h3><p>The Escrow Agent's duties are purely ministerial. The Escrow Agent may rely conclusively upon any instrument believed genuine and shall not be liable for any action taken in good faith absent gross negligence or willful misconduct. The Escrow Agent shall be entitled to fees per Exhibit A, borne 50% by Buyer and 50% by the Sellers' Representative, and to indemnification from the Parties.</p>
<h3>5. Miscellaneous</h3><p>Investment of the Escrow Fund shall be limited to the instruments described on Exhibit B. Tax reporting of income shall be to the Sellers. This Agreement is governed by Delaware law; exclusive venue lies in the Delaware Court of Chancery.</p>`
},

{
id:"boardconsent", name:"Board Consent / Resolutions", cat:"Closing Deliverables", icon:"🖋️",
about:"The formal document where the board of directors approves the deal — required for corporate authority.",
simplified:`<h2>Board Consent</h2><h3>Simplified Training Version</h3>
<p><b>What it is:</b> a company can't sign a huge deal just because the CEO likes it. The board of directors must formally approve. This document is that approval, in writing.</p>
<div class="cl"><b>1. The board has read the deal.</b> Directors reviewed the purchase agreement and key terms.</div>
<div class="cl"><b>2. The board thinks it's good for the company.</b> ("advisable, fair, and in the best interests of the corporation and its stockholders") — this language connects to directors' fiduciary duties.</div>
<div class="cl"><b>3. Approval.</b> The agreement and the transaction are approved.</div>
<div class="cl"><b>4. Authorization.</b> Officers are authorized to sign everything needed to make the deal happen.</div>
<p><b>Fun fact:</b> in Delaware, boards can act by unanimous written consent instead of holding a live meeting.</p>`,
realistic:`<h2>UNANIMOUS WRITTEN CONSENT OF THE BOARD OF DIRECTORS OF [TARGET]</h2>
<p>The undersigned, constituting all of the members of the Board of Directors (the "<b>Board</b>") of [TARGET], a Delaware corporation (the "<b>Corporation</b>"), acting by unanimous written consent without a meeting pursuant to Section 141(f) of the General Corporation Law of the State of Delaware, hereby adopt the following resolutions:</p>
<h3>Approval of the Transaction</h3>
<p><b>WHEREAS</b>, the Board has reviewed the Share Purchase Agreement (the "<b>Agreement</b>") proposed to be entered into by and among [ACQUIRER], the stockholders of the Corporation, and the Corporation, together with the ancillary agreements contemplated thereby (collectively, the "<b>Transaction Documents</b>");</p>
<p><b>WHEREAS</b>, the Board has received such information, advice of counsel, and analyses as it deems necessary to evaluate the transactions contemplated by the Transaction Documents (the "<b>Transaction</b>"), and has considered the interests of the Corporation and its stockholders;</p>
<p><b>NOW, THEREFORE, BE IT RESOLVED</b>, that the Board hereby determines that the Agreement and the Transaction are advisable, fair to, and in the best interests of the Corporation and its stockholders;</p>
<p><b>RESOLVED FURTHER</b>, that the Agreement and each of the Transaction Documents, in substantially the forms presented to the Board, are hereby approved, adopted, and authorized in all respects, with such changes as the Authorized Officers may approve, such approval to be conclusively evidenced by execution and delivery thereof;</p>
<p><b>RESOLVED FURTHER</b>, that each of the Chief Executive Officer and the Chief Financial Officer (each an "<b>Authorized Officer</b>") is hereby authorized, empowered, and directed to execute and deliver the Transaction Documents and any other certificates, instruments, and documents, and to take all such further actions, as such Authorized Officer deems necessary or advisable to consummate the Transaction;</p>
<p><b>RESOLVED FURTHER</b>, that all actions heretofore taken by any officer or director of the Corporation in connection with the Transaction are hereby ratified, confirmed, and approved in all respects.</p>
<p>This consent may be executed in counterparts and shall be filed with the minutes of the proceedings of the Board.</p>
<p>IN WITNESS WHEREOF, the undersigned have executed this consent as of [DATE].</p>`
}

/* ---------- GLOSSARY (chatbot knowledge) ---------- */
const GLOSSARY = {
"nda":{t:"NDA (Non-Disclosure Agreement)",d:"A contract signed at the very start of deal talks. Both sides promise to keep shared information secret and use it only to evaluate the deal. It does not obligate anyone to do the deal. Typical term: 2 years."},
"loi":{t:"LOI (Letter of Intent)",d:"A mostly non-binding letter sketching the deal: price, structure, diligence period, and timeline. The exclusivity, confidentiality, and expenses clauses ARE usually binding. Signals serious intent before lawyers draft the definitive agreement."},
"term sheet":{t:"Term Sheet",d:"A bullet-point summary of the deal's key economics and legal terms: price, payment mix, escrow, earnout, conditions, indemnity caps. Faster to negotiate than full contracts; it frames the drafting of the SPA/APA."},
"spa":{t:"SPA (Share Purchase Agreement)",d:"The definitive contract in a stock deal. Buyer purchases the target's shares, acquiring the whole company with all assets AND all liabilities (including unknown ones). Core sections: purchase price & adjustments, reps & warranties, covenants, closing conditions, indemnification, termination."},
"apa":{t:"APA (Asset Purchase Agreement)",d:"The definitive contract in an asset deal. Buyer picks specific assets and only expressly assumed liabilities; everything else stays with the seller. More paperwork (each asset/contract must transfer) but cleaner liability protection."},
"merger":{t:"Merger",d:"A statutory combination where two companies become one by operation of law; the target's shares convert into the merger consideration. Requires board approval and usually a shareholder vote. Contrast with a stock purchase (buying shares directly) or asset purchase (buying assets)."},
"due diligence":{t:"Due Diligence",d:"The buyer's organized investigation of the target before committing: financial statements, material contracts, litigation, taxes, IP ownership, employment, compliance. Findings shape price, disclosure schedules, indemnities, and sometimes kill the deal. Associates do the document review and produce a diligence report flagging red flags."},
"disclosure schedule":{t:"Disclosure Schedules",d:"The exceptions appendix to the purchase agreement. The seller's reps say 'everything is fine except as disclosed' — the schedules list the exceptions (lawsuits, expiring contracts, tax audits). If disclosed, the buyer generally can't claim indemnification for it later."},
"escrow":{t:"Escrow",d:"A portion of the purchase price (often 5–15%) held by a neutral bank after closing, typically 12–24 months, as the first source of recovery if the seller breached its reps. Governed by a three-party Escrow Agreement (buyer, sellers' representative, escrow agent)."},
"earnout":{t:"Earnout",d:"Contingent purchase price paid later only if the target hits agreed milestones (revenue, EBITDA, product launch). Bridges valuation gaps but is a notorious source of post-closing disputes over how the buyer runs the business."},
"reps and warranties":{t:"Representations & Warranties",d:"Factual promises each side makes in the agreement — e.g., financials are GAAP-accurate, taxes paid, no undisclosed litigation, IP is owned. If false, the harmed party may get indemnification or, pre-closing, the right to walk. 'Fundamental reps' (ownership, authority) get longer survival and higher caps."},
"indemnification":{t:"Indemnification",d:"The post-closing compensation mechanism: if a rep was false or a covenant breached, the seller reimburses the buyer's losses. Limited by baskets/deductibles (small claims don't count), caps (max recovery), and survival periods (deadlines to claim). Usually paid first from escrow."},
"basket":{t:"Basket / Deductible",d:"A minimum threshold of losses before indemnification kicks in — e.g., claims only count once total losses exceed 0.75% of the price. A 'tipping basket' pays from dollar one once tipped; a 'true deductible' pays only the excess."},
"cap":{t:"Indemnity Cap",d:"The maximum a seller can owe for indemnification claims — often 10% of the price for general reps (frequently just the escrow), but up to the full price for fundamental reps or fraud."},
"mac":{t:"MAC / MAE (Material Adverse Change/Effect)",d:"A closing condition: buyer can refuse to close if a disaster materially damages the target's business between signing and closing. Courts (especially Delaware) read MAC clauses narrowly — general market downturns usually don't count; durationally-significant company-specific collapses might. Akorn v. Fresenius (2018) is the rare case where a MAC let the buyer walk."},
"covenants":{t:"Covenants",d:"Promises about behavior. Pre-closing: seller runs the business in the ordinary course, no new debt or asset sales without consent. Post-closing: non-compete, non-solicit, confidentiality, tax cooperation."},
"closing conditions":{t:"Closing Conditions",d:"The checklist that must be true before either side must close: regulatory approvals received, reps still accurate ('bring-down'), covenants performed, no injunction, no MAC, key consents delivered. If a condition fails, the burdened party can walk."},
"hsr":{t:"HSR Act (Antitrust)",d:"The Hart-Scott-Rodino Act requires parties to deals above a size threshold (adjusted annually, roughly $126M in 2025) to notify the FTC/DOJ and wait — usually 30 days — before closing. Agencies can issue a 'Second Request,' which extends review substantially. Deal lawyers coordinate with antitrust specialists on filing strategy."},
"exclusivity":{t:"Exclusivity / No-Shop",d:"A binding promise (usually in the LOI) that the seller won't negotiate with other buyers for a set window (30–90 days) while the deal is documented. Protects the buyer's investment of time and fees."},
"break-up fee":{t:"Break-Up / Termination Fee",d:"A fee (often 2–4% of deal value in public deals) paid by a party that walks away in specified circumstances — e.g., the target accepts a superior proposal. Compensates the jilted party for costs and lost opportunity."},
"working capital adjustment":{t:"Working Capital Adjustment",d:"A price true-up ensuring the buyer receives the business with a normal level of operating assets. Compare closing working capital to an agreed 'peg'; the price moves dollar-for-dollar. Finalized ~90 days post-closing, a common source of disputes."},
"fiduciary duties":{t:"Fiduciary Duties",d:"Directors owe the company and shareholders a duty of care (be informed, deliberate) and a duty of loyalty (no self-dealing, act in good faith). In a sale of control, Revlon duties require directors to seek the best reasonably available price."},
"business judgment rule":{t:"Business Judgment Rule",d:"Courts presume informed, disinterested, good-faith board decisions are valid and won't second-guess them. Rebutted by conflicts of interest, bad faith, or gross negligence — then stricter review (entire fairness) applies."},
"revlon":{t:"Revlon Duties",d:"From Revlon v. MacAndrews & Forbes (Del. 1986): once a company's sale or breakup is inevitable, the board's job narrows to getting the best price reasonably available for shareholders — it becomes an auctioneer, not a defender."},
"poison pill":{t:"Poison Pill (Rights Plan)",d:"A takeover defense: if a hostile bidder crosses an ownership threshold (often 10–15%), all OTHER shareholders may buy shares at a discount, massively diluting the bidder. Forces negotiation with the board rather than a raid."},
"golden parachute":{t:"Golden Parachute",d:"Large severance packages for executives triggered by a change of control. Meant to keep management neutral during a sale; criticized when they look like rewards for selling."},
"tender offer":{t:"Tender Offer",d:"A public offer to buy shares directly from a company's shareholders at a premium, bypassing the board. Regulated by the Williams Act (SEC rules on timing and disclosure). Common in hostile takeovers."},
"hostile takeover":{t:"Hostile Takeover",d:"An acquisition attempt the target's board opposes. Tools: tender offers directly to shareholders and proxy fights to replace the board. Defenses: poison pills, staggered boards, white knights."},
"synergies":{t:"Synergies",d:"The extra value a combined company should create: cost synergies (eliminating duplicate functions, purchasing power) and revenue synergies (cross-selling, new markets). Often used to justify the premium — and often overestimated."},
"deposition":{t:"Deposition",d:"Sworn out-of-court testimony taken under oath during litigation discovery, recorded by a court reporter. A witness answers questions from opposing counsel; the transcript can impeach them at trial. In M&A disputes (e.g., a busted deal), executives get deposed about what they knew and when. Defending counsel may object to form but usually can't instruct silence except for privilege."},
"discovery":{t:"Discovery",d:"The pre-trial phase in litigation where each side must share relevant evidence: document requests, interrogatories (written questions), and depositions (oral testimony under oath)."},
"privilege":{t:"Attorney-Client Privilege",d:"Confidential communications between lawyer and client for the purpose of legal advice are protected from disclosure. In M&A, common-interest agreements can preserve privilege when parties share analyses; carelessly forwarding legal advice can waive it."},
"delaware":{t:"Why Delaware?",d:"Most large U.S. companies incorporate in Delaware for its developed corporate case law, the expert Court of Chancery (no juries, fast decisions), and predictable statutes (DGCL). That's why deal documents usually choose Delaware law and courts."},
"stock purchase":{t:"Stock Purchase",d:"Buying the target's shares from its shareholders. Simple transfer, company stays intact — but buyer inherits ALL liabilities, known and unknown. Compare: asset purchase (pick and choose) and merger (statutory combination, good with many shareholders)."},
"asset purchase":{t:"Asset Purchase",d:"Buying selected assets and assuming only chosen liabilities. Cleaner risk profile for the buyer, better tax step-up, but heavier mechanics: every contract may need consent to assign, and employees must be re-hired."},
"consideration":{t:"Consideration",d:"What the buyer pays: cash, buyer stock, seller notes, earnouts, or a mix. Cash is certain; stock lets sellers share the upside (and risk); earnouts bridge disagreements about the future."},
"letter of intent binding":{t:"Is an LOI binding?",d:"Mostly no — the deal terms are expressly non-binding. But specific clauses ARE binding: exclusivity, confidentiality, expenses, governing law. Courts have occasionally imposed a binding duty to negotiate in good faith, so drafters mark non-binding intent clearly."},
"material contracts":{t:"Material Contracts",d:"The target's most important agreements — top customer and supplier contracts, leases, loans, licenses. Diligence checks for change-of-control clauses (does the deal itself trigger termination or consent rights?), exclusivity, and MFN pricing terms."},
"change of control":{t:"Change-of-Control Clause",d:"A contract term triggered when a company is acquired: the counterparty may terminate, demand consent, or accelerate obligations. A key diligence hunt — losing a top customer contract at closing can gut deal value."},
"gaap":{t:"GAAP",d:"Generally Accepted Accounting Principles — the standard U.S. accounting rulebook. Sellers rep that their financial statements were prepared per GAAP and fairly present the company's condition."},
"firpta":{t:"FIRPTA Certificate",d:"A closing deliverable certifying the seller isn't a foreign person (or the target isn't a U.S. real property holding company), which lets the buyer avoid withholding 15% of the price for the IRS."},
"wire fraud":{t:"Closing Wire Safety",d:"Deal teams verify wire instructions by phone at a known number before sending funds — business email compromise scams love closings. The flow-of-funds memo lists every wire, amount, and recipient."},
"sellers representative":{t:"Sellers' Representative",d:"One person or firm appointed to act for all selling shareholders after closing: negotiating working capital true-ups, defending indemnity claims, and instructing the escrow agent. Saves the buyer from herding dozens of sellers."},
"fraud":{t:"Fraud Carve-Out",d:"Indemnity caps and baskets typically do NOT protect a seller who committed actual fraud — intentional misrepresentation strips away the negotiated limits in most agreements and under Delaware law (ABRY Partners v. F&W)."},
"antitrust":{t:"Antitrust Review",d:"Regulators (FTC/DOJ in the U.S.) review whether a deal would substantially lessen competition. Tools: HSR filings, waiting periods, Second Requests, and lawsuits to block. Remedies can include divestitures of overlapping businesses."},
"second request":{t:"Second Request",d:"In HSR review, the agencies' demand for extensive additional documents and data. It suspends the ability to close until substantial compliance plus another waiting period — often adds 6–12 months to a deal."},
"ordinary course":{t:"Ordinary Course of Business",d:"How the target must operate between signing and closing: business as usual, consistent with past practice. No unusual asset sales, raises, dividends, or new debt without buyer consent. Protects the buyer from getting a different company at closing."},
"bring-down":{t:"Bring-Down Condition",d:"At closing, the seller's reps must still be true (often subject to a materiality or MAE qualifier) as if made on the closing date. The officer's certificate 'brings down' the reps from signing to closing."},
"survival":{t:"Survival Period",d:"How long after closing a rep can support an indemnity claim. Typical: 12–24 months for general reps; 6 years or statute-of-limitations for fundamental reps and taxes; forever for fraud."},
"boilerplate":{t:"Boilerplate / Miscellaneous",d:"The back-of-the-contract machinery: governing law, jurisdiction, notices, assignment, entire agreement, severability, counterparts. Rarely negotiated hard — until a dispute makes them decisive."}
