/* ---------- extra glossary for the new practice areas ---------- */
Object.assign(GLOSSARY,{
"demand futility":{t:"Demand Futility (Rule 23.1)",d:"Before a shareholder sues derivatively, they must demand the board sue itself — unless demand would be futile because a majority of directors are conflicted, lack independence, or face substantial liability. Plaintiffs must plead this with particularized facts."},
"caremark":{t:"Caremark Oversight Claim",d:"A director-liability theory for failing to oversee: no reporting system at all, or consciously ignoring red flags. Hard to win — it requires bad faith, not mere negligence. Marchand v. Barnhill (2019) revived it for mission-critical risks."},
"section 220":{t:"Section 220 Books-and-Records Demand",d:"A Delaware shareholder's right to inspect corporate records for a proper purpose (investigating wrongdoing, valuing shares). Often the first step before a fiduciary duty suit — 'tools at hand' the courts expect plaintiffs to use."},
"entire fairness":{t:"Entire Fairness",d:"The strictest standard of review, applied when a controlling shareholder or conflicted board is on both sides of a deal. Defendants must prove fair dealing (process) and fair price (substance). Contrast the deferential business judgment rule."},
"special litigation committee":{t:"Special Litigation Committee (SLC)",d:"Independent directors appointed to investigate a derivative claim and decide whether the corporation should pursue it. Under Zapata, courts scrutinize the committee's independence, good faith, and reasonable basis."},
"wells notice":{t:"Wells Notice",d:"The SEC Staff's notice that it intends to recommend enforcement action, giving the recipient a chance to make a written 'Wells submission' arguing why charges shouldn't be brought. Named after the 1972 Wells Committee."},
"materiality":{t:"Materiality",d:"Information is material if a reasonable investor would consider it important in deciding to buy, sell, or vote (TSC Industries; Basic v. Levinson). The threshold question in disclosure cases — and in diligence."},
"scienter":{t:"Scienter",d:"The mental state required for securities fraud: intent to deceive or, in most circuits, recklessness. Negligence isn't enough for Rule 10b-5 — which is why disclosure defenses focus on good-faith process."},
"cooperation credit":{t:"Cooperation Credit",d:"Regulators reduce penalties for self-reporting, remediation, and genuine cooperation (the SEC's Seaboard factors). Counsel's judgment call: how much to volunteer, how early."},
"anticipatory breach":{t:"Anticipatory Breach (Repudiation)",d:"When one party clearly signals it won't perform before performance is due, the other side may treat the contract as breached immediately, stop its own performance, and sue — rather than waiting for the deadline."},
"expectation damages":{t:"Expectation Damages",d:"The default contract remedy: put the non-breaching party where it would have been had the contract been performed — lost profits included, subject to foreseeability, certainty, and the duty to mitigate."},
"limitation of liability":{t:"Limitation of Liability Clause",d:"Contract terms capping damages (often at fees paid) and excluding consequential damages. Usually enforced between sophisticated parties, but not for fraud or, in some states, gross negligence."},
"force majeure":{t:"Force Majeure",d:"A clause excusing performance for extraordinary events beyond a party's control (war, natural disaster, sometimes pandemics or strikes). Read narrowly: the event must be listed or clearly within the catch-all, and must actually cause the non-performance."},
"s-1":{t:"Form S-1 (Registration Statement)",d:"The SEC filing that registers securities for a public offering: business description, risk factors, MD&A, audited financials, and the prospectus. The SEC reviews it and issues comment letters before declaring it effective."},
"quiet period":{t:"Quiet Period / Gun-Jumping",d:"Communications restrictions around a public offering. Hyping the company before or during registration ('gun-jumping') can delay the IPO or create liability. Counsel vets every public statement."},
"lock-up":{t:"Lock-Up Agreement",d:"Insiders and pre-IPO holders agree not to sell shares for a period (typically 180 days) after the IPO, preventing a flood of supply. Underwriters insist on it; founders negotiate carve-outs."},
"dual-class":{t:"Dual-Class Stock",d:"Share classes with different voting rights, letting founders keep control with a minority economic stake. Popular in tech IPOs; criticized by governance advocates; some indexes exclude dual-class companies."},
"sox 404":{t:"SOX 404 (Internal Controls)",d:"Sarbanes-Oxley Section 404 requires public companies to assess and report on internal control over financial reporting. New issuers get a transition period; a 'material weakness' is a serious IPO risk factor."},
"duty of care":{t:"Duty of Care",d:"Directors must act on an informed basis, with the care a reasonably prudent person would use — read the materials, ask questions, take time, get advice. Breach requires gross negligence; exculpation charters (DGCL §102(b)(7)) usually eliminate money damages for pure care claims."},
"duty of loyalty":{t:"Duty of Loyalty",d:"Directors must put the corporation's interests ahead of their own: no self-dealing, no usurping corporate opportunities, and acting in good faith. Cannot be exculpated — loyalty breaches carry personal liability."},
"independent committee":{t:"Independent / Special Committee",d:"A committee of disinterested, independent directors formed to negotiate or review a conflicted transaction. A well-functioning committee (with its own advisors and real bargaining power) can restore deference to the board's decision."},
"conflict of interest":{t:"Conflict of Interest",d:"A director stands on both sides of a decision or gets a personal benefit not shared by stockholders. Conflicts trigger disclosure, recusal, and stricter judicial review; undisclosed conflicts are the classic loyalty breach."},
"standing":{t:"Standing (Derivative Suits)",d:"To sue derivatively, a plaintiff must have owned shares at the time of the alleged wrong (contemporaneous ownership) and continuously through the litigation, and must fairly represent the corporation's interests."},
"waste":{t:"Corporate Waste",d:"An exchange so one-sided that no reasonable businessperson could conclude the corporation received adequate value — e.g., grossly excessive compensation for nothing. Rarely proven; it's the 'nothing in return' standard."},
"exculpation":{t:"Exculpation (§102(b)(7))",d:"A charter provision eliminating directors' personal monetary liability for breaches of the duty of care. It does not cover loyalty breaches, bad faith, or intentional misconduct — which is why plaintiffs plead loyalty."},
"internal controls":{t:"Internal Controls",d:"The processes ensuring financial reporting is accurate and assets are safeguarded. Public companies must maintain and assess them (SOX 404); regulators charge 'books and records' and controls violations even without proving fraud."},
"disclosure":{t:"Disclosure Obligations",d:"Public companies must disclose material information accurately in periodic reports and offering documents, and must not omit facts necessary to make statements not misleading. Timing of disclosure is often the whole case."},
"tolling":{t:"Tolling Agreement",d:"An agreement pausing the statute of limitations, commonly requested by regulators near a deadline. Refusing can accelerate charges; agreeing buys time to negotiate — a strategic call for counsel."},
"disgorgement":{t:"Disgorgement",d:"Returning ill-gotten gains — an equitable remedy regulators seek alongside penalties. Limited by the Supreme Court (Liu v. SEC) to net profits and generally for the benefit of victims."},
"undertakings":{t:"Undertakings",d:"Commitments a company makes in a settlement: retain a compliance consultant, adopt new controls, report to the agency. Undertakings often substitute for a portion of the penalty and demonstrate remediation."},
"material breach":{t:"Material Breach",d:"A failure to perform that goes to the heart of the contract, excusing the other party's performance and supporting termination and damages. Minor breaches only support damages — the distinction decides who can walk away."},
"consequential damages":{t:"Consequential Damages",d:"Indirect losses flowing from a breach (lost profits on other deals, reputational harm). Recoverable only if foreseeable — and very commonly excluded by contract, which is why the limitation-of-liability clause matters."},
"mitigation":{t:"Duty to Mitigate",d:"The non-breaching party must take reasonable steps to reduce its losses (find a replacement supplier, resell goods). Damages that could have been avoided are not recoverable."},
"cure period":{t:"Cure Period",d:"A contractual window (often 30 days) after notice of breach during which the breaching party may fix the problem before termination rights arise. Skipping the notice-and-cure step can convert the innocent party into the breacher."},
"waiver":{t:"Waiver",d:"Intentionally giving up a known right — e.g., repeatedly accepting late deliveries may waive strict timing. Anti-waiver clauses try to prevent this, but conduct can still speak louder than boilerplate."},
"liquidated damages":{t:"Liquidated Damages",d:"A pre-agreed damages amount for a specified breach. Enforceable if a reasonable forecast of hard-to-measure harm; unenforceable as a penalty if it's just a club."},
"audit committee":{t:"Audit Committee",d:"An independent board committee overseeing financial reporting, the outside auditor, and internal controls. Exchange listing rules require one for public companies — a must-have on any IPO readiness checklist."},
"risk factors":{t:"Risk Factors",d:"The S-1 section disclosing what could go wrong — specific, tailored risks, not boilerplate. Well-drafted risk factors are a liability shield; generic ones draw SEC comments and plaintiffs."},
"gun-jumping":{t:"Gun-Jumping",d:"Improperly promoting an offering before the registration statement is filed or effective — interviews, hype, forward-looking claims. The SEC can impose a cooling-off period, delaying the IPO."},
"cheap stock":{t:"Cheap Stock",d:"Equity or options granted to insiders shortly before an IPO at prices well below the offering price. The SEC scrutinizes the valuations and may require compensation charges — a common comment-letter topic."}
});

{kick:"Module 13", h:"Governance Disputes: Care, Loyalty, and Deference", body:`<ul>
<li>Directors owe the <b>duty of care</b> (informed process) and the <b>duty of loyalty</b> (no self-dealing, good faith).</li>
<li>The <b>business judgment rule</b> protects honest, informed decisions — plaintiffs attack the <b>process</b> to strip it away.</li>
<li>Conflicts flip the standard to <b>entire fairness</b>: defendants must prove fair dealing and fair price.</li>
<li>Tools at hand: a <b>§220 books-and-records demand</b> before suing; special committees as a defense.</li></ul>`},
{kick:"Module 14", h:"Derivative Suits: Suing on the Company's Behalf", body:`<ul>
<li>The claim belongs to the corporation; the shareholder is a stand-in — so <b>demand</b> on the board comes first, unless <b>futile</b>.</li>
<li>Rule 23.1 demands <b>particularized facts</b>: adjectives lose motions.</li>
<li><b>Caremark</b> theories need red flags that were consciously ignored, not just bad outcomes.</li>
<li>Boards respond with a <b>special litigation committee</b>; courts test its independence under <b>Zapata</b>.</li></ul>`},
{kick:"Module 15", h:"Regulatory Investigations: Subpoena to Settlement", body:`<ul>
<li>Day one: <b>document hold</b>, map the subpoena, decide on self-reporting.</li>
<li>Run a credible <b>internal investigation</b>; protect <b>privilege</b>; build the chronology before the Staff does.</li>
<li>The <b>Wells process</b> is your written shot at persuading the Staff on <b>materiality</b> and <b>scienter</b>.</li>
<li>Resolution currency: <b>cooperation credit</b>, remediation, undertakings — and a consent order that neither admits nor denies.</li></ul>`},
{kick:"Module 16", h:"Contract Disputes: Read the Whole Contract", body:`<ul>
<li>Start with <b>breach</b>, <b>cure periods</b>, <b>remedies</b>, and the <b>limitation of liability</b> — the cap often decides the case.</li>
<li><b>Expectation damages</b> are the default; consequential damages are usually excluded; <b>mitigation</b> is mandatory.</li>
<li>Defenses: <b>force majeure</b>, prior breach, waiver, failure to give notice.</li>
<li>Forum and choice-of-law clauses decide <b>where</b> and <b>under what law</b> you fight — read them first.</li></ul>`},
{kick:"Module 17", h:"IPO Readiness: Becoming a Public Company", body:`<ul>
<li>Governance first: independent directors, an <b>audit committee</b>, committee charters.</li>
<li>Disclosure: the <b>S-1</b>, honest <b>risk factors</b>, MD&A — and no <b>gun-jumping</b> during the quiet period.</li>
<li>Controls: a <b>SOX 404</b> readiness plan; a material weakness is a headline risk factor.</li>
<li>Deal terms: <b>lock-ups</b>, underwriting agreement, <b>dual-class</b> trade-offs between control and investor appetite.</li></ul>`}

/* ---------- firm theme (colors as CSS variables) ---------- */
function shade(hex,p){
  const h=(hex||"#101a2e").replace("#",""); if(h.length!==6) return hex;
  const n=parseInt(h,16); const r=n>>16,g=(n>>8)&255,b=n&255;
  const f=c=>Math.max(0,Math.min(255,Math.round(p<0?c*(1+p):c+(255-c)*p)));
  return "#"+[f(r),f(g),f(b)].map(x=>x.toString(16).padStart(2,"0")).join("");
}
function applyTheme(){

    const c=(S&&S.firm&&S.firm.colors)||{}; const root=document.documentElement;
    const P=c.primary||"#101a2e", G=c.secondary||"#c8a45c";
    const isDefault=P.toLowerCase()==="#101a2e"&&G.toLowerCase()==="#c8a45c";
    const vars=isDefault?{"--navy":"#101a2e","--navy2":"#16233f","--navy3":"#1d2f55","--blue":"#2b4c8c","--blue2":"#3a63b8","--gold":"#c8a45c","--ink":"#0b0e16","--black":"#07080c"}

    for(const k in vars) root.style.setProperty(k,vars[k]);
  }catch(e){}
}
function firmMark(cls){

}

/* ---------- firm ledger ---------- */
function fmtMoney(n){ const s=Math.abs(n).toLocaleString(undefined,{maximumFractionDigits:0}); return (n<0?"−$":"$")+s; }
function computePayout(d,score){
  const c=ct(d); const [lo,hi]=c.payout_range||[5000,20000];
  if(score>=5){ return {outcome:"won", amount:Math.round(lo+((score-5)/5)*(hi-lo))}; }
  if(score>=3.5){ return {outcome:"settled", amount:Math.round(lo*0.35)}; }
  return {outcome:"lost", amount:-Math.round(lo*0.25)};
}
function postLedger(d){
  const f=S.firm; f.transactions=f.transactions||[]; f.balance=f.balance||0;
  if(f.transactions.some(t=>t.case_id===d.id)) return null;
  const p=computePayout(d,d.rating.overall);
  const tx={id:uid(),case_id:d.id,codename:d.codename,case_type:d.caseType||DEFAULT_CASE_TYPE,outcome:p.outcome,amount:p.amount,score:d.rating.overall,timestamp:new Date().toISOString()};

}

function load(){

    if(raw){
      S = JSON.parse(raw);
      migrate();
      return;
    }
  }catch(e){}
  S = seedState(); save();
}
/* Upgrades older saves in place — never wipes user data. */
function migrate(){
  S.study = S.study||{}; S.badges = S.badges||{};
  const f=S.firm=S.firm||JSON.parse(JSON.stringify(FIRM_DEFAULTS));
  if(!f.firm_id) f.firm_id="firm_"+uid();
  f.colors=f.colors||{primary:"#101a2e",secondary:"#c8a45c"};
  if(f.logo===undefined) f.logo=null;
  f.letterhead=f.letterhead||"classic";
  f.balance=typeof f.balance==="number"?f.balance:0;
  f.transactions=f.transactions||[];
  if(f.unlocked_case_types===undefined) f.unlocked_case_types=null;
  (S.deals||[]).forEach(d=>{
    if(!d.caseType) d.caseType=DEFAULT_CASE_TYPE;
    d.rooms=d.rooms||[];
    if(!d.rooms.find(r=>r.type==="argument")) d.rooms.push(makeArgumentRoom(d.createdAt||now(), ct(d)));
    if(d.status==="closed"&&d.rating&&!f.transactions.some(t=>t.case_id===d.id)) postLedger(d);
  });
}

/* ---------- leaderboard ---------- */
function firmStats(){
  const closed=S.deals.filter(d=>d.status==="closed"&&d.rating);
  if(!closed.length) return {deals:0,avg:0,best:null};
  const avg=Math.round(closed.reduce((a,d)=>a+d.rating.overall,0)/closed.length*10)/10;
  const best=closed.slice().sort((a,b)=>b.rating.overall-a.rating.overall)[0];
  return {deals:closed.length,avg,best:{code:best.codename,score:best.rating.overall}};
}

let INVITE_TEXT="";
function inviteTextFor(u){
  const url=(typeof APP_URL!=="undefined"&&APP_URL)?APP_URL:location.href.split("#")[0];
  return "You've been invited to join "+S.firm.name+" on Briefing Room, our corporate law firm simulator."+
    "\n\nYour role: "+(ROLES[u.role]?ROLES[u.role].label:u.role)+
    "\n\nSign in here: "+url+
    "\nEmail: "+u.email+
    "\nTemporary password: "+u.pw+
    "\n\nOn your phone? Install it as an app: open the link, then on iPhone use Safari's Share button > Add to Home Screen; on Android use Chrome's menu > Add to Home screen / Install app. It launches full-screen with its own icon."+
    "\n\nOnce you're in: check your Dashboard for assigned matters, open the Document Library, and ask the AI Legal Associate anything about the case."+
    "\n\n— "+(me()?me().name:"The Managing Partner")+", "+S.firm.name;

function openInviteModal(userId){
  const u=userById(userId); if(!u||!u.email) return;
  INVITE_TEXT=inviteTextFor(u);
  const subj=encodeURIComponent("Invitation to join "+S.firm.name+" — Briefing Room");
  const body=encodeURIComponent(INVITE_TEXT);
  openModal(`<div class="modal"><h3>✉ Invite ${esc(u.name)}</h3>
    <p class="sub">Send them their sign-in link and credentials. This demo has no mail server, so the invite opens pre-written in your own email app — or copy it anywhere (text, Slack, etc.).</p>

    </div></div>`);

function copyInvite(){
  try{
    navigator.clipboard.writeText(INVITE_TEXT).then(()=>toast("Invite copied to clipboard"),()=>fallbackCopy());

}
function fallbackCopy(){
  const ta=document.createElement("textarea"); ta.value=INVITE_TEXT; document.body.appendChild(ta);
  ta.select(); try{ document.execCommand("copy"); toast("Invite copied to clipboard"); }catch(e){ toast("Copy blocked — select the text manually"); }
  document.body.removeChild(ta);
}

function saveDeal(existingId){

  const tx=[...document.querySelectorAll(".df-tx:checked")].map(x=>x.value);

  if(existingId){
    const d=S.deals.find(x=>x.id===existingId);
    Object.assign(d,{codename:code,structure:g("df-structure"),price:g("df-price").trim()||"TBD",
      consideration:g("df-cons").trim(),risks:g("df-risks").trim(),clientSide:g("df-side"),
      timelineDays:days, deadline:d.createdAt+days*86400000, docMode:g("df-modeval"),

  const deal={id:uid(),codename:code,caseType:typeId,status:"active",createdAt:t0,createdBy:S.session,closedAt:null,rating:null,
    acquirer:{name:acq,desc:g("df-acqd").trim()},target:{name:tgt,desc:g("df-tgtd").trim()},
    clientSide:side,structure,price:g("df-price").trim()||"TBD",
    consideration:g("df-cons").trim(),timelineDays:days,deadline:t0+days*86400000,
    risks:g("df-risks").trim(),docMode:g("df-modeval"),teamClient:tc,teamCounter:tx,leads:[S.session],
    persona:{title:c.persona.title, company:client, mode:(typeId===DEFAULT_CASE_TYPE?(side==="acquirer"?"buy":"sell"):(side==="acquirer"?"buy":"sell"))},
    tasks:c.workstreams(t0,days,tc,tx,structure).map(t=>({id:uid(),title:t.title,ws:t.ws,assignee:t.a||null,due:t0+Math.max(1,Math.round(days*t.p))*86400000,done:false})),
    docs:[],details:[],
    rooms:[
      {id:uid(),name:"Case Room — General",type:"general",depo:false,msgs:[{id:uid(),sys:true,text:c.label+" opened: "+acq+" "+c.verb+" "+tgt+". Our client: "+client+".",ts:t0}]},
      {id:uid(),name:typeId===DEFAULT_CASE_TYPE?"Due Diligence":"War Room",type:"general",depo:false,msgs:[]},
      {id:uid(),name:"Deposition Room",type:"deposition",depo:false,witness:"",msgs:[{id:uid(),sys:true,text:"Reserved for depositions. A partner can put this room on the record.",ts:t0}]},
      {id:uid(),name:"Client Line",type:"client",depo:false,msgs:[
        {id:uid(),sys:true,text:"Direct line to the client. The "+c.persona.title+" of "+client+" answers here — interview them like it's a real matter.",ts:t0},
        {id:uid(),client:true,text:"Counsel — glad you're on this. "+(typeId===DEFAULT_CASE_TYPE
          ?(side==="acquirer"?"Acquiring "+other+" is the biggest bet I've taken and my board expects it closed in "+days+" days.":"Selling to "+other+" wasn't easy, but my shareholders want it done. Protect us in the documents.")
          :"This "+c.label.toLowerCase()+" with "+other+" is the thing that keeps me up at night, and I need it handled in "+days+" days.")+" Ask me anything; just be straight with me.",ts:t0+60000}
      ]},

    ]};
  S.deals.unshift(deal);
  logAct("created "+c.label+" case "+code); save(); closeModal(); go("deal",{id:deal.id}); toast(c.label+" case opened");

/* ---------- the AI client character ---------- */
function clientAnswer(d,q){
  const query=q.toLowerCase();
  const p=d.persona||{title:"Chief Executive",company:"the client",mode:"buy"};
  const buying=p.mode==="buy";
  const other = buying ? d.target.name : d.acquirer.name;
  const openRuins=d.details.filter(x=>x.impact==="ruin"&&!x.resolved);
  const lastDetail=d.details[0];
  const daysLeft=Math.ceil((d.deadline-now())/86400000);
  const pick=(arr)=>arr[Math.floor(Math.random()*arr.length)];
  if(/who are you|your role|introduce|what do you do/.test(query))
    return "I'm the "+p.title+" of "+p.company+". "+(buying?"I've staked my credibility on acquiring "+other+" — the board approved it on my recommendation.":"I built this company, and now I'm trusting your firm to get us sold to "+other+" without my people getting hurt.")+" You're my lawyers; be straight with me.";
  if(/price|valuation|how much|worth|pay/.test(query))
    return (buying?"We're in at "+d.price+(d.consideration?" — "+d.consideration:"")+". I can defend that number to my board as long as diligence doesn't surprise me. If you find something, I want it priced, escrowed, or fixed — not ignored.":"The headline is "+d.price+(d.consideration?" — "+d.consideration:"")+". My shareholders think it's fair. Just watch the working capital adjustment; I've heard stories about buyers clawing back value after closing.");
  if(/why (are you |do you |)(sell|buy|acquir|doing)|rationale|strategy|reason/.test(query))
    return buying?"Simple: "+(d.target.desc||other+" fills the gap in our roadmap")+". Organic build would take three years; this takes one signature. That's why the timeline matters to me.":"Because "+(d.acquirer.desc||other+" can scale what we built")+". And frankly, my investors want liquidity. The earlier we close, the fewer things can go wrong.";
  if(/risk|worr|concern|afraid|nervous|scare|keep you up/.test(query))
    return (d.risks?"You want my honest list? "+d.risks+" — that's what keeps me up at night. ":"Honestly, the quiet is what worries me. ")+(openRuins.length?"And now this "+openRuins[0].title.toLowerCase()+" situation. Tell me you have a plan.":"So far your team has kept things clean. Keep it that way.");
  if(/employee|team|people|staff|talent|key/.test(query))
    return buying?"The people ARE the asset — especially the engineering leads. I want retention agreements signed before closing, and I don't want word leaking before we're ready to announce.":"I need you to protect my people in this deal. Severance terms, retention packages — the ones who built this deserve a soft landing. What does the buyer's paper say?";
  if(/document|nda|loi|spa|apa|diligence|data room|schedule|escrow|paper/.test(query))
    return "My team will get you whatever the data room needs — finance is pulling contracts and statements now. Just tell me exactly what's missing and by when. "+(buying?"And don't let their disclosure schedules bury something material in a footnote.":"And keep our disclosure schedules airtight; I'd rather over-disclose than get an indemnity claim in a year.");
  if(/timeline|when|close|closing|deadline|how long/.test(query))
    return daysLeft>=0?"We have "+daysLeft+" days. "+(buying?"My board reviews progress weekly, and financing commitments don't wait forever.":"Every extra week is another chance for the buyer to get cold feet.")+" Where are we against the checklist?":"We're past the date I promised. I need a real closing date from you this week — what's blocking us?";
  if(/competitor|rival|bidder|other offer|auction/.test(query))
    return openRuins.some(x=>/bidder|compet/.test(x.title.toLowerCase()))?"You saw the development. "+(buying?"If someone outbids us after all this work, that's on all of us. What does exclusivity actually protect?":"A second bidder is leverage — but only if we handle it without blowing up the deal on the table. Advise me.")
    :(buying?"No credible rival bid so far — exclusivity is doing its job. Keep the pace up anyway.":"We signed exclusivity, so my hands are tied. Make sure the buyer knows we honored it.");
  if(/development|news|twist|update|what happened|latest/.test(query))
    return lastDetail?("On the "+lastDetail.title.toLowerCase()+" — "+(lastDetail.impact==="aid"?"finally some good news. Use it; push the pace.":"I heard. "+(lastDetail.resolved?"Your team handled it well — that's why I hired this firm.":"I want options on my desk: fix it, price it, or paper around it. Which is it?"))):"Nothing new from my side. Quiet weeks are for tightening documents, your partner tells me.";
  if(/regulator|antitrust|hsr|ftc|government|approval/.test(query))
    return "The HSR filing has me on edge — a second request would blow the timeline apart. "+(buying?"Our antitrust counsel says overlap is thin, but agencies surprise people. What's your read?":"The buyer carries most of that risk, but a blocked deal hurts me more than them. Keep me posted.");
  if(/hello|hi |hey|good (morning|afternoon|evening)|thank/.test(query))
    return pick(["Counsel. Talk to me — where do we stand?","Good to hear from the lawyers. I have a board call in an hour; give me something useful.","Appreciate the work your team is putting in. What do you need from me?"]);
  return pick([
    "That's a question for the lawyers — that's why I pay your firm. What I care about is simple: "+(buying?"close "+(other?("on "+other):"this deal")+" on time, at "+d.price+", with no surprises.":"get my shareholders paid and my people protected. Everything else is detail."),
    "I'll be honest, counsel — the legal machinery is your world. Mine is running "+p.company+". Frame it for me in money, time, or risk and I'll give you a decision.",
    "Put that in a one-paragraph email my board can read. In the meantime: are we on schedule, and is anything about to bite us?"]);
}

/* ---------- deposition transcript grading ---------- */
function gradeDeposition(r){
  const userMsgs=r.msgs.filter(m=>m.depo&&!m.sys&&!m.client);
  if(!userMsgs.length) return null;
  const witness=r.msgs.filter(m=>m.depo&&m.client);
  const questions=userMsgs.filter(m=>/\?/.test(m.text));
  const precise=questions.filter(m=>
    m.text.length<220 &&
    /(\d|schedule|document|exhibit|agreement|contract|price|escrow|consent|customer|assignment|ip |filing|when did|what date|who |which |board|minutes|email|memo)/i.test(m.text)
  ).length;
  const vague=userMsgs.length-questions.length;
  const deflect=/(don'?t recall|won'?t speculate|is there a question|rephrase|won'?t adopt|instructed not to|wait for a question|sounded like testimony|without guessing|more reliable than my memory|can'?t answer that as phrased)/i;
  const admissions=witness.filter(m=>!deflect.test(m.text)).length;
  const clamp=v=>Math.max(1,Math.min(10,Math.round(v*10)/10));
  const score=clamp(2 + precise*1.3 + admissions*0.7 - vague*0.6 + (questions.length>=3?0.5:0));
  return {score, asked:userMsgs.length, questions:questions.length, precise, admissions, vague};
}

/* ---------- the AI client CEO under oath ---------- */
function deposedAnswer(d,q){
  const query=q.toLowerCase();
  const p=d.persona||{title:"Chief Executive",company:"the client",mode:"buy"};
  const buying=p.mode==="buy";
  const other=buying?d.target.name:d.acquirer.name;
  const openRuins=d.details.filter(x=>x.impact==="ruin"&&!x.resolved);
  const pick=(arr)=>arr[Math.floor(Math.random()*arr.length)];
  if(/thank|no further questions|that('s| is) all|we('re| are) done/.test(query))
    return "Understood, counsel.";
  if(/speculate|guess|estimate|hypothetical|what if|would (you |the company |)have/.test(query))
    return "I've been instructed not to speculate, and I won't. Hypotheticals aren't testimony.";
  if(!/\?/.test(q) && q.split(/\s+/).length>2 && !/^(yes|no|correct|state|describe|explain|tell)/.test(query))
    return pick(["Is there a question in there, counsel?","I'll wait for a question.","That sounded like testimony, counsel — yours, not mine."]);
  if(/state your name|who are you|your name|for the record|your role|your title|introduce/.test(query))
    return "For the record: I serve as "+p.title+" of "+p.company+". I appear here voluntarily and I am represented by counsel.";
  if(/isn'?t it true|wouldn'?t you agree|you always|you never|admit/.test(query))
    return pick(["Counsel, that question assumes facts I haven't agreed to. Asked fairly, my answer is: we acted on the information we had at the time, on advice of counsel and our bankers.","I won't adopt your characterization. What I can tell you is what happened, and it's reflected in the documents.","That's a compound question with a conclusion baked in. Break it apart and I'll answer each piece truthfully."]);
  if(/when did you (know|learn|find|become aware)|did you know|were you aware|what did you know/.test(query))
    return pick(["I don't recall the specific date. I learned of it when my team briefed me, and the correspondence reflecting that is in the record my counsel produced.","To the best of my recollection, I became aware of it in the ordinary course — through a briefing, not before. If you have a document suggesting otherwise, show it to me and I'll address it.","I can't give you a date without guessing, and I've been advised not to guess. The board materials will show when it was first presented."]);
  if(/price|valuation|how much|consideration|pay|worth/.test(query))
    return "The consideration is "+d.price+", as stated in the agreement. It was negotiated at arm's length with advice from our financial advisors. I won't characterize it beyond what the documents say.";
  if(/why (did|are|were) you|rationale|reason|motive|purpose/.test(query))
    return (buying?"The board concluded, on management's recommendation, that acquiring "+other+" served the company's strategic interests. That judgment is documented in the board minutes.":"The board determined a sale to "+other+" was in the best interests of our shareholders. The process that led there is documented, and I stand by it.")+" I'd refer you to the record for the deliberations.";
  if(/risk|problem|red flag|defect|issue|hide|conceal|withhold|omit/.test(query))
    return pick(["We disclosed what the agreement required us to disclose. The disclosure schedules speak for themselves — if it's on the schedules, it was disclosed; I have no recollection of anything material that wasn't.","Nothing was concealed to my knowledge. Diligence was extensive, counsel — your side had the data room.","To the best of my recollection, every material issue known to management was either disclosed or addressed in the documents. I can't testify to what individual employees may have known."]);
  if(/development|twist|the news|announcement|event/.test(query)||openRuins.some(x=>query.includes((x.title||"").toLowerCase().split(" ")[0])))
    return openRuins.length?"I'm aware of the "+openRuins[0].title.toLowerCase()+". I learned of it when my team informed me, we notified the other side consistent with our obligations, and how it's handled is a matter for the lawyers. Beyond that I won't speculate.":"I'm not aware of any undisclosed development, counsel. If you have something specific, put it in front of me.";
  if(/document|email|memo|letter|schedule|exhibit|show you/.test(query))
    return pick(["If you show me the document, I'll do my best to answer questions about it. I won't testify about a document from memory.","I'd have to see it. I review a great many documents, counsel; I don't carry them in my head under oath."]);
  if(/employee|staff|team|people|officer|management/.test(query))
    return "Our people acted professionally throughout, to my knowledge. Questions about specific individuals' knowledge should be put to them — I can only testify to what I know.";
  if(/speculate|guess|estimate|hypothetical|what if|would have/.test(query))
    return "I've been instructed not to speculate, and I won't. Hypotheticals aren't testimony.";
  if(/regulator|antitrust|hsr|ftc|government/.test(query))
    return "We made the filings our counsel advised were required, when they advised it. The filings are public record — or at least produced in this matter. I defer to antitrust counsel on the substance.";
  if(/thank|no further questions|that('s| is) all/.test(query))
    return "Understood, counsel.";
  return pick([
    "To the best of my recollection, I can't answer that as phrased without guessing. Can you rephrase it?",
    "I want to be accurate under oath, counsel, so I'll say: I don't recall with the precision you're asking for. The documents will be more reliable than my memory.",
    "I'll answer what I know: the transaction was negotiated in good faith, on advice of counsel, and the record reflects it. Beyond that, ask me something specific."]);
}

/* ---------- AI opposing counsel + argument scoring ---------- */
function issuesMentioned(text,c){
  const q=text.toLowerCase();
  return c.key_issues.filter(k=>{ const g=GLOSSARY[k]; const names=[k].concat(g?[g.t.toLowerCase().split(" (")[0]]:[]); return names.some(n=>q.includes(n)); });
}
function proceduralMentioned(text,c){ const q=text.toLowerCase(); return c.procedural.filter(k=>q.includes(k)); }
function scoreArgumentMsg(text,c){
  const words=text.trim().split(/\s+/).length;
  const issues=issuesMentioned(text,c).length, proc=proceduralMentioned(text,c).length;
  const reasoning=(text.match(/\b(because|therefore|under|pursuant|the record|section|§|shows|establishes|accordingly|which means)\b/gi)||[]).length;
  const cites=/(exhibit|schedule|minutes|email|agreement|clause|section|§|\d{4})/i.test(text);
  const offer=/(\$[\d,]+|propose|offer|settle|accept|agree to|in exchange|concede|willing to)/i.test(text);
  return {issues, proc, reasoning, cites, offer, words};
}
function gradeArgument(r,c){
  const mine=r.msgs.filter(m=>!m.sys&&!m.opp&&!m.client);
  if(!mine.length) return null;
  const clamp=v=>Math.max(1,Math.min(10,Math.round(v*10)/10));
  const allText=mine.map(m=>m.text).join(" \n ");
  const distinctIssues=new Set(issuesMentioned(allText,c)).size, distinctProc=new Set(proceduralMentioned(allText,c)).size;
  const scores=mine.map(m=>m.argScore||scoreArgumentMsg(m.text,c));
  const avgWords=scores.reduce((a,s)=>a+s.words,0)/scores.length;
  const reasoning=scores.reduce((a,s)=>a+s.reasoning,0), cites=scores.filter(s=>s.cites).length, offers=scores.filter(s=>s.offer).length;
  const issue_spotting=clamp(2+distinctIssues*1.6);
  const argument_quality=clamp(2+(avgWords>=18&&avgWords<=140?2.5:avgWords>140?1.5:0)+Math.min(3,reasoning*0.6)+Math.min(2.5,cites*0.8));
  const negotiation_outcome=clamp(2+Math.min(4,offers*1.3)+Math.min(4,(r.concessions||0)*1.3));
  const procedural_accuracy=clamp(2+distinctProc*1.8);
  const w=c.rubric.issue_spotting!==undefined?c.rubric:{issue_spotting:.3,argument_quality:.3,negotiation_outcome:.2,procedural_accuracy:.2};
  const score=clamp(issue_spotting*w.issue_spotting+argument_quality*w.argument_quality+negotiation_outcome*w.negotiation_outcome+procedural_accuracy*w.procedural_accuracy);
  return {score,issue_spotting,argument_quality,negotiation_outcome,procedural_accuracy,turns:mine.length,distinctIssues,distinctProc,offers,concessions:r.concessions||0};
}
function opposingAnswer(d,r,text){
  const c=ct(d); const L=OPPOSING_LINES[c.opposing.style]||OPPOSING_LINES.deal;
  const s=scoreArgumentMsg(text,c);
  const q=text.toLowerCase();
  if(/^(hi|hello|hey|good (morning|afternoon|evening))\b/.test(q)) return L.open;
  // strong, well-cited, issue-anchored argument earns a concession
  if(s.issues>=1 && s.cites && (s.reasoning>=1 || s.words>=25)){ r.concessions=(r.concessions||0)+1; return L.concede; }
  if(s.offer) return L.number(text.match(/\$[\d,]+/)?text.match(/\$[\d,]+/)[0]:"");
  if(s.issues>=1){ const k=issuesMentioned(text,c)[0]; const g=GLOSSARY[k]; return L.issue(g?g.t.split(" (")[0].toLowerCase():k); }
  if(s.proc>=1) return L.procedure;
  if(/(exhibit|document|schedule|minutes|email|record)/i.test(text)) return L.docs;
  return L.fallback;
}

<script>
/* =====================================================
   VIEWS C: AI chatbot, training slides, closing & rating, init
   ===================================================== */

/* ---------- rating engine (dispatches on case type) ---------- */
function computeRating(d){
  const c=ct(d);
  return c.engine==="deal" ? computeDealRating(d) : computeDisputeRating(d,c);
}
function computeDisputeRating(d,c){
  const clamp=(v)=>Math.max(1,Math.min(10,Math.round(v*10)/10));
  const argRoom=d.rooms.find(r=>r.type==="argument");
  const g=argRoom?gradeArgument(argRoom,c):null;
  const docsN=d.docs.length;
  const done=d.tasks.filter(t=>t.done).length, total=Math.max(1,d.tasks.length);
  const aids=d.details.filter(x=>x.impact==="aid").length;
  const ruinsHandled=d.details.filter(x=>x.impact==="ruin"&&x.resolved).length;
  const ruinsOpen=d.details.filter(x=>x.impact==="ruin"&&!x.resolved).length;
  const daysOver=Math.ceil(((d.closedAt||now())-d.deadline)/86400000);
  const depoScores=d.rooms.map(r=>r.depoScore).filter(Boolean);
  const depo=depoScores.length?clamp(depoScores.reduce((a,x)=>a+x.score,0)/depoScores.length):null;
  // Four rubric dimensions blend argument-room performance with case execution
  const issue_spotting=clamp((g?g.issue_spotting:2)*0.7 + Math.min(10,2+docsN*1.2)*0.3);
  const argument_quality=clamp((g?g.argument_quality:2)*0.8 + (depo!==null?depo:5)*0.2);
  const negotiation_outcome=clamp((g?g.negotiation_outcome:2)*0.6 + clamp(5+aids*1.5+ruinsHandled*1.5-ruinsOpen*2)*0.4);
  const procedural_accuracy=clamp((g?g.procedural_accuracy:2)*0.6 + clamp(1+(done/total)*9)*0.25 + clamp(daysOver<=0?9.5:9-daysOver*0.8)*0.15);
  const w=c.rubric;
  const overall=clamp(issue_spotting*w.issue_spotting+argument_quality*w.argument_quality+negotiation_outcome*w.negotiation_outcome+procedural_accuracy*w.procedural_accuracy);
  const verdict=overall>=8.5?"a commanding result":overall>=7?"a strong result":overall>=5.5?"a respectable result":overall>=4?"a shaky result":"a result the client will remember for the wrong reasons";
  const turns=g?g.turns:0;
  const expl=[];
  expl.push(`<b>Issue spotting (${issue_spotting}/10):</b> counsel raised ${g?g.distinctIssues:0} of the ${c.key_issues.length} key issues in the argument room${docsN?" and filed "+docsN+" document"+(docsN===1?"":"s")+" to the record":""}${(g?g.distinctIssues:0)>=4?" — the analysis found the pressure points":(g?g.distinctIssues:0)>=2?" — solid coverage, but issues left unraised are leverage left on the table":" — the case's central doctrines went largely unnamed"}.`);
  expl.push(`<b>Argument quality (${argument_quality}/10):</b> ${turns} argument turn${turns===1?"":"s"}${g?(g.argument_quality>=7?" — reasoned, record-anchored advocacy that cited documents and connected facts to law":g.argument_quality>=5?" — competent advocacy that would improve with more citations to the record and tighter reasoning":" — assertions without reasoning or citations; opposing counsel was never made to work"):" — no arguments were made; the other side's opening statement stood unanswered"}${depo!==null?"; deposition performance graded "+depo+"/10":""}.`);
  expl.push(`<b>Negotiation outcome (${negotiation_outcome}/10):</b> ${g&&g.offers?g.offers+" concrete proposal"+(g.offers===1?"":"s")+" put on the table":"no concrete proposals were made"}, ${g&&g.concessions?"and opposing counsel conceded "+g.concessions+" point"+(g.concessions===1?"":"s"):"and no concessions were extracted"}${aids||ruinsHandled?"; "+(aids+ruinsHandled)+" development"+(aids+ruinsHandled===1?"":"s")+" turned to the client's advantage":""}${ruinsOpen?"; "+ruinsOpen+" adverse development"+(ruinsOpen===1?"":"s")+" left unresolved":""}.`);
  expl.push(`<b>Procedural accuracy (${procedural_accuracy}/10):</b> ${g?g.distinctProc:0} procedural mechanism${(g?g.distinctProc:0)===1?"":"s"} correctly invoked, ${done}/${total} workstream tasks completed, and the matter ${daysOver<=0?"resolved on time":"ran "+daysOver+" day"+(daysOver===1?"":"s")+" past the deadline"}${(g?g.distinctProc:0)>=3?" — procedure was used as a weapon, which is what separates litigators from commentators":" — remember that procedure (demands, notices, standing, deadlines) is where most disputes are actually won or lost"}.`);
  return {overall, issue_spotting, argument_quality, negotiation_outcome, procedural_accuracy, depo, engine:"dispute",
    text:`The Case Review Bot rates <b>${esc(d.codename)}</b> (${esc(c.label)}) <b>${overall}/10</b> — ${verdict}. `+expl.join(" ")};
}
function computeDealRating(d){
  const clamp=(v)=>Math.max(1,Math.min(10,Math.round(v*10)/10));
  // Evidence: documents filed
  const docsN=d.docs.length;
  const evidence=clamp(2 + docsN*1.4);
  // Acquisitions (execution): task completion
  const done=d.tasks.filter(t=>t.done).length, total=Math.max(1,d.tasks.length);
  const acquisition=clamp(1 + (done/total)*9);
  // Benefits: favorable developments + handled adverse ones
  const aids=d.details.filter(x=>x.impact==="aid").length;
  const ruinsHandled=d.details.filter(x=>x.impact==="ruin"&&x.resolved).length;
  const benefits=clamp(5 + aids*1.5 + ruinsHandled*1.2);
  // Cost: damage from unhandled adverse developments
  const ruinsOpen=d.details.filter(x=>x.impact==="ruin"&&!x.resolved).length;
  const cost=clamp(9 - ruinsOpen*2.5 - (d.details.filter(x=>x.impact==="ruin").length?0.5:0));
  // Time: closed vs deadline
  const daysOver=Math.ceil(((d.closedAt||now())-d.deadline)/86400000);
  const time=clamp(daysOver<=0 ? 9.5 + Math.min(0.5,-daysOver*0.05) : 9 - daysOver*0.8);
  // Deposition skill: graded transcripts from this deal's deposition rooms
  const depoScores=d.rooms.map(r=>r.depoScore).filter(Boolean);
  const depo=depoScores.length?clamp(depoScores.reduce((a,x)=>a+x.score,0)/depoScores.length):null;
  const overall=depo!==null
    ? clamp(evidence*0.18 + acquisition*0.22 + benefits*0.18 + cost*0.14 + time*0.18 + depo*0.10)
    : clamp(evidence*0.2 + acquisition*0.25 + benefits*0.2 + cost*0.15 + time*0.2);

  const verdict = overall>=8.5?"an exemplary closing":overall>=7?"a strong closing":overall>=5.5?"a workmanlike closing":overall>=4?"a rocky closing":"a closing that survived by luck";
  const expl=[];
  expl.push(`<b>Evidence (${evidence}/10):</b> the team filed ${docsN} document${docsN===1?"":"s"} to the record${docsN>=6?" — a thorough paper trail across the deal's stages":docsN>=3?" — a serviceable record, though a fuller trail (diligence memos, executed ancillaries) would strengthen the file":" — a thin file; a well-run deal leaves a heavier paper trail"}.`);
  expl.push(`<b>Acquisitions & execution (${acquisition}/10):</b> ${done} of ${total} workstream tasks were completed${done===total?" — every workstream closed out, which is exactly how a checklist should die":done/total>=0.7?" — most workstreams landed, with some loose ends at closing":" — significant workstreams were left open, which in a live deal means closing conditions at risk"}.`);
  expl.push(`<b>Benefits (${benefits}/10):</b> ${aids?aids+" favorable development"+(aids===1?"":"s")+" captured":"no favorable developments arose"}${ruinsHandled?", and the team neutralized "+ruinsHandled+" adverse twist"+(ruinsHandled===1?"":"s"):""}${!aids&&!ruinsHandled?" — the deal closed on its baseline economics alone":""}.`);
  expl.push(`<b>Cost (${cost}/10):</b> ${ruinsOpen?ruinsOpen+" adverse development"+(ruinsOpen===1?"":"s")+" went unaddressed at closing — unresolved risk a real buyer would have priced, escrowed, or walked over":"no unresolved adverse developments were carried into closing — clean risk hygiene"}.`);
  expl.push(`<b>Time (${time}/10):</b> the deal closed ${daysOver<=0?Math.abs(daysOver)+" day"+(Math.abs(daysOver)===1?"":"s")+" ahead of the "+d.timelineDays+"-day timeline":daysOver+" day"+(daysOver===1?"":"s")+" past the deadline — in practice, delay burns exclusivity, financing commitments, and client patience"}.`);
  if(depo!==null){
    const totQ=depoScores.reduce((a,x)=>a+x.questions,0), totP=depoScores.reduce((a,x)=>a+x.precise,0), totA=depoScores.reduce((a,x)=>a+x.admissions,0);
    expl.push(`<b>Deposition skill (${depo}/10):</b> across ${depoScores.length} graded deposition${depoScores.length===1?"":"s"}, counsel asked ${totQ} question${totQ===1?"":"s"} (${totP} precise) and extracted ${totA} substantive answer${totA===1?"":"s"} — ${depo>=7?"disciplined, document-anchored examination":depo>=5?"serviceable examination with room for sharper, more specific questions":"the witness controlled the room; precise, specific questions move sworn witnesses, vague ones don't"}.`);
  }
  const argRoom=d.rooms.find(r=>r.type==="argument"); const g=argRoom?gradeArgument(argRoom,ct(d)):null;
  if(g) expl.push(`<b>Negotiation (${g.score}/10, informational):</b> ${g.turns} argument turn${g.turns===1?"":"s"} against counterparty counsel, ${g.concessions} concession${g.concessions===1?"":"s"} won.`);
  return {overall, evidence, acquisition, benefits, cost, time, depo, engine:"deal",
    text:`The Deal Review Bot rates <b>${esc(d.codename)}</b> <b>${overall}/10</b> — ${verdict}. `+expl.join(" ")};
}

function dealClose(d,u){
  if(d.status==="closed" && d.rating){
    const r=d.rating;
    const bar=(lbl,v)=>`<div class="rate-bar"><div class="lbl"><span>${lbl}</span><span>${v}/10</span></div><div class="trk"><div class="fill" style="width:${v*10}%"></div></div></div>`;
    return `<div class="card pad-lg">
      <div class="rate-hero">
        <div class="tiny" style="letter-spacing:.3em;text-transform:uppercase;color:var(--gold);margin-bottom:10px">Deal Review Bot · Final Rating</div>
        <div class="big">${r.overall}<span>/10</span></div>
        <div class="muted small" style="margin-top:8px">Closed ${fmtDate(d.closedAt)} · ${esc(d.structure)} · ${esc(d.price)}</div>
      </div>
      ${(function(){ const tx=(S.firm.transactions||[]).find(t=>t.case_id===d.id); return tx?`<div style="text-align:center;margin:-10px 0 18px"><span class="chip ${tx.amount>=0?"green":"red"}" style="font-size:12px;padding:6px 14px">Firm ledger: ${tx.outcome.toUpperCase()} · ${fmtMoney(tx.amount)}</span> <button class="btn ghost xs" onclick="go('ledger')">View account →</button></div>`:""; })()}
      <div class="rate-bars">
        ${r.engine==="dispute"?`
        ${bar("Issue spotting",r.issue_spotting)}
        ${bar("Argument quality",r.argument_quality)}
        ${bar("Negotiation outcome",r.negotiation_outcome)}
        ${bar("Procedural accuracy",r.procedural_accuracy)}`:`
        ${bar("Evidence — the record",r.evidence)}
        ${bar("Acquisitions — execution",r.acquisition)}
        ${bar("Benefits — value captured",r.benefits)}
        ${bar("Cost — risk absorbed",r.cost)}
        ${bar("Time — pace to close",r.time)}`}
        ${typeof r.depo==="number"?bar("Deposition skill — examination quality",r.depo):""}
      </div>
      <div class="divider"></div>
      <div class="small" style="max-width:760px;margin:0 auto;line-height:1.7">${r.text}</div>
    </div>`;
  }
  if(!isPartner(u)) return `<div class="empty">Only partners can close a case. Finish your tasks, argue in the Argument Room, and file your work product — it all counts toward the rating.</div>`;
  const done=d.tasks.filter(t=>t.done).length; const c=ct(d);
  const ruinsOpen=d.details.filter(x=>x.impact==="ruin"&&!x.resolved).length;
  const argRoom=d.rooms.find(r=>r.type==="argument"); const g=argRoom?gradeArgument(argRoom,c):null;
  return `<div class="card pad-lg" style="max-width:680px">
    <h3 style="font-size:18px;margin-bottom:8px">${esc(c.closeVerb)}: ${esc(d.codename)}</h3>
    <p class="muted small" style="margin-bottom:16px">Closing ends the simulation and triggers the Review Bot, which rates the case 1–10 on <b>${Object.keys(c.rubric).map(k=>k.replace(/_/g," ")).join(", ")}</b> with a written explanation, then posts the payout (${fmtMoney(c.payout_range[0])}–${fmtMoney(c.payout_range[1])} for a win; a flat penalty for a loss) to the firm account. Rooms become read-only transcripts.</p>
    ${g?`<div class="small" style="margin-bottom:6px">Argument room running score: <b>${g.score}/10</b> over ${g.turns} turn${g.turns===1?"":"s"}</div>`:`<div class="small" style="margin-bottom:6px;color:var(--amber)">No arguments made yet — the Argument Room is worth ${Math.round((c.rubric.issue_spotting||0)*100+(c.rubric.argument_quality||0)*100)}%+ of a dispute rating.</div>`}
    <div class="small" style="margin-bottom:6px">Pre-closing snapshot:</div>
    <ul class="small muted" style="margin-left:18px;margin-bottom:18px">
      <li>${done}/${d.tasks.length} tasks complete</li>
      <li>${d.docs.length} documents filed</li>
      <li>${d.details.length} developments injected · ${ruinsOpen} adverse still open</li>
      <li>${Math.ceil((d.deadline-now())/86400000)>=0?Math.ceil((d.deadline-now())/86400000)+" days left on the timeline":"past deadline"}</li>
    </ul>
    <button class="btn" onclick="closeDeal('${d.id}')">⚖ ${esc(c.closeVerb)} & get the rating</button>
  </div>`;
}
function closeDeal(dealId){
  const d=S.deals.find(x=>x.id===dealId);
  d.status="closed"; d.closedAt=now(); d.rating=computeRating(d);
  const tx=postLedger(d);
  d.rooms[0].msgs.push({id:uid(),sys:true,text:"🔔 THE MATTER IS CLOSED. Final rating: "+d.rating.overall+"/10"+(tx?" · Firm account: "+tx.outcome+" "+fmtMoney(tx.amount):"")+" — see the Rating tab.",ts:now()});

function balanceChart(){

/* ---------- AI chatbot ---------- */
function botAnswer(q){
  const query=q.toLowerCase().replace(/[?!.]/g," ").replace(/\s+/g," ").trim();
  const u=me();
  // deal-context questions
  const ctxDeal = route.dealId ? S.deals.find(d=>d.id===route.dealId) : (myDeals(u).filter(d=>d.status==="active")[0]||null);
  if(ctxDeal){
    const d=ctxDeal;
    if(/\b(my deal|the deal|this deal|active deal|current deal)\b/.test(query) && /\b(what|which|tell|about|summar)/.test(query) || /^tell me about (the|my|this) deal/.test(query)){
      return `<p>Your active matter is <b>${esc(d.codename)}</b>: <b>${esc(d.acquirer.name)}</b> acquiring <b>${esc(d.target.name)}</b> via ${esc(d.structure)} for ${esc(d.price)}. Our client is ${d.clientSide==="acquirer"?esc(d.acquirer.name):esc(d.target.name)}. ${d.risks?"Known risks: "+esc(d.risks):""}</p><p>${d.tasks.filter(t=>!t.done).length} tasks remain open. Required document mode: <b>${d.docMode}</b>.</p>`;
    }
    if(/(who('?s| is)? on|staffed|assigned to|the team|my team)/.test(query) && /(team|deal|matter|case)/.test(query)){
      const tc=(d.teamClient||[]).map(id=>userById(id).name).join(", ")||"nobody yet";
      const tx=(d.teamCounter||[]).map(id=>userById(id).name).join(", ")||"nobody yet";
      return `<p>Staffing on <b>${esc(d.codename)}</b>:</p><ul><li><b>Client side</b> (${d.clientSide==="acquirer"?esc(d.acquirer.name):esc(d.target.name)}): ${esc(tc)}</li><li><b>Counterparty side</b>: ${esc(tx)}</li></ul>`;
    }
    if(/\b(price|how much|consideration|purchase price)\b/.test(query) && /\b(deal|paying|titan|acquisition)\b/.test(query)){
      return `<p>The consideration on <b>${esc(d.codename)}</b> is <b>${esc(d.price)}</b>${d.consideration?" — structured as "+esc(d.consideration):""}. Ask me about escrow or earnouts if you want the mechanics of those pieces.</p>`;
    }
    if(/\b(deadline|when.*(close|closing)|timeline|due date)\b/.test(query)){
      const days=Math.ceil((d.deadline-now())/86400000);
      return `<p><b>${esc(d.codename)}</b> is on a ${d.timelineDays}-day timeline — ${days>=0?days+" days remain until the target closing date ("+fmtDate(d.deadline)+")":"the deadline passed "+(-days)+" days ago ("+fmtDate(d.deadline)+"), which would be burning exclusivity and financing commitments in a live deal"}.</p>`;
    }
    if(/my task|what should i do|what do i do|my assignment|my work|what are my/.test(query)){
      const mine=d.tasks.filter(t=>t.assignee===u.id&&!t.done);
      return mine.length?`<p>Your open tasks on <b>${esc(d.codename)}</b>:</p><ul>${mine.map(t=>`<li><b>${esc(t.title)}</b> — ${esc(t.ws)}, due ${fmtDate(t.due)}</li>`).join("")}</ul><p>Ask me about any of these workstreams and I'll walk you through the substance.</p>`:`<p>You have no open tasks on <b>${esc(d.codename)}</b>. Offer a partner help with the diligence review or the disclosure schedules — that's how associates get staffed on the interesting work.</p>`;
    }
    if(/\b(development|twist|risk|what went wrong|new detail)\b/.test(query)&&/\b(deal|titan|latest|any)\b/.test(query)){
      return d.details.length?`<p>Developments on <b>${esc(d.codename)}</b>:</p><ul>${d.details.map(x=>`<li><b>${esc(x.title)}</b> (${x.impact==="aid"?"favorable":"adverse"}${x.resolved?", handled":", open"}) — ${esc(x.text)}</li>`).join("")}</ul>`:`<p>No developments have been injected on <b>${esc(d.codename)}</b> yet. In a live deal, quiet weeks are when you tighten the disclosure schedules.</p>`;
    }
  }
  // topic KB first (process/multi-concept questions beat single-term glossary)
  for(const t of KB_TOPICS){
    if(t.k.some(k=>query.includes(k))) return t.a;
  }
  // glossary matching — longest key match wins
  let best=null,bestLen=0;
  for(const k in GLOSSARY){
    if(query.includes(k) && k.length>bestLen){ best=GLOSSARY[k]; bestLen=k.length; }
  }
  // aliases
  const alias={"non-disclosure":"nda","nondisclosure":"nda","letter of intent":"loi","share purchase":"spa","asset purchase agreement":"apa","material adverse":"mac","mae":"mac","hart-scott":"hsr","hart scott":"hsr","no-shop":"exclusivity","no shop":"exclusivity","termination fee":"break-up fee","breakup fee":"break-up fee","rep and warrant":"reps and warranties","representations":"reps and warranties","indemnity":"indemnification","fiduciary":"fiduciary duties","poison":"poison pill","tender":"tender offer","hostile":"hostile takeover","working capital":"working capital adjustment","escrow agreement":"escrow","disclosure schedules":"disclosure schedule","attorney-client":"privilege","attorney client":"privilege"};
  for(const a in alias){ if(query.includes(a) && a.length>bestLen){ best=GLOSSARY[alias[a]]; bestLen=a.length; } }
  if(best){
    return `<p><b>${esc(best.t)}</b></p><p>${esc(best.d)}</p>`;
  }
  // greetings
  if(/^(hi|hello|hey|good (morning|afternoon|evening))\b/.test(query)){
    return `<p>Counsel. What are we working on — a term of art, a document, deal process, or your active matter?</p>`;
  }
  // fallback
  return `<p>I don't have a confident answer for that phrasing — and in this firm we don't guess. Try one of these lanes:</p><ul>
  <li><b>Terminology</b>: "what is an earnout", "explain MAC", "what's a poison pill"</li>
  <li><b>Documents</b>: "what does an SPA do", "explain disclosure schedules", "is an LOI binding"</li>
  <li><b>Process</b>: "stages of a merger", "what happens at closing", "diligence red flags", "how do depositions work"</li>
  <li><b>Doctrine</b>: "fiduciary duties", "Revlon", "business judgment rule", "why Delaware"</li>
  <li><b>Your deal</b>: "tell me about my deal", "who's on the team", "what are my tasks"</li></ul>`;
}

function gradeQuiz(ti,answers){
  const qs=QUIZZES[ti]; let correct=0;

  return {correct, total:qs.length, passed: correct>=QUIZ_PASS};

function submitQuiz(ti){
  const qs=QUIZZES[ti];

    <p class="sub">Firm Academy · Self-Study</p>
    <div class="card" style="background:var(--ink);margin-bottom:16px"><p class="small" style="line-height:1.7">${esc(g.d)}</p></div>
    <p class="tiny muted" style="margin-bottom:14px">Want to test it? Ask the AI Legal Associate a scenario question — e.g. "give me an example of ${esc(g.t.split("(")[0].trim().toLowerCase())} in a real deal".</p>
    <div class="row" style="justify-content:flex-end">
      <button class="btn ghost sm" onclick="closeModal();go('bot')">Ask the AI about this</button>
      <button class="btn ${mine[key]?"danger":""} sm" onclick="S.study['${u.id}']['${key.replace(/'/g,"\\'")}']=${mine[key]?"false":"true"};save();closeModal();render();toast('${mine[key]?"Moved back to studying":"Marked as mastered"}')">${mine[key]?"Un-master":"✓ Mark as mastered"}</button>
    </div></div>`);
}

/* ---------- render dispatcher ---------- */
function render(){
  const app=document.getElementById("app");
  const u=me();
  const priv=["dashboard","deals","deal","folder","library","bot","training","directory","admin","settings","board","ledger"];
  if(priv.includes(route.page)&&(!u||u.role==="guest")){ route={page: u?"landing":"login"}; }
  let html="";
  switch(route.page){
    case "landing": html=vLanding(); break;
    case "login": html=vLogin(); break;
    case "dashboard": html=vDashboard(); break;
    case "deals": html=vDeals(); break;
    case "deal": html=vDeal(); break;
    case "folder": html=vFolder(); break;
    case "library": html=vLibrary(); break;
    case "bot": html=vBot(); break;
    case "training": html=vTraining(); break;
    case "directory": html=vDirectory(); break;
    case "admin": html=vAdmin(); break;
    case "settings": html=vSettings(); break;
    case "board": html=vBoard(); break;
    case "ledger": html=vLedger(); break;
    default: html=vLanding();
  }
  app.innerHTML=html;
  if(route.page==="deal"&&ui.dealTab==="chat") scrollChat();
  if(route.page==="bot") scrollBot();
}
document.addEventListener("keydown",e=>{
  if(route.page==="training"&&ui.trainTab==="slides"&&!e.target.closest("input,textarea")){
    if(e.key==="ArrowRight"&&ui.slide<SLIDES.length-1){ui.slide++;render();}
    if(e.key==="ArrowLeft"&&ui.slide>0){ui.slide--;render();}
  }
});

/* ---------- boot ---------- */
load();
applyTheme();
if(S.session && me() && me().role!=="guest") route={page:"dashboard"};
render();
</script>

try{
  if(location.protocol==="https:" && navigator.serviceWorker){
    window.addEventListener("load",function(){ try{ navigator.serviceWorker.register("sw.js").catch(function(){}); }catch(e){} });
  }
}catch(e){/* sandboxed preview contexts block service workers - safe to ignore */}
</script>
